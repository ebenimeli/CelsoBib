<div id="ws-embed" role="group" aria-label="Juego: Sopa de letras">
  <style>
    /* ===== INTEGRACIÓN EN #main ===== */
    #ws-embed {
      grid-column: 1 / -1;
      grid-row: 1 / -1;
      width: 100%;
      padding: 8px;
      container-type: inline-size;
      color: var(--c-text, #222);
    }

    #ws-embed .frame {
      background: var(--c-bg, #fff);
      border: 1px solid var(--c-border, #ddd);
      border-radius: 12px;
      padding: 10px;
      position: relative;
      overflow: hidden;
    }

    #ws-embed .title {
      font-weight: 700;
      margin: 0 0 6px;
    }

    #ws-embed .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    #ws-embed .btn {
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      font: inherit;
    }

    #ws-embed .btn[aria-pressed="true"] {
      background: #eef5ff;
      border-color: #b9d2ff;
      font-weight: 700;
    }

    #ws-embed .grid {
      --cell: 34px;
      display: grid;
      gap: 2px;
      user-select: none;
      touch-action: none;
      margin-top: 8px;
      justify-content: start;
      background: var(--c-muted, #f5f5f5);
      padding: 8px;
      border-radius: 8px;
    }

    #ws-embed .cell {
      width: var(--cell);
      height: var(--cell);
      display: grid;
      place-items: center;
      font-weight: 700;
      background: #fff;
      border: 1px solid #eee;
      border-radius: 6px;
      line-height: 1;
    }

    #ws-embed .cell.sel {
      outline: 2px solid #7db3ff;
      outline-offset: -2px;
      background: #eef5ff;
    }

    #ws-embed .cell.found {
      background: #e6ffe8;
      border-color: #b8f0c0;
    }

    #ws-embed .aside {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    #ws-embed .desc {
      background: color-mix(in oklab, white 90%, transparent);
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 8px;
    }

    #ws-embed .words {
      background: #fff;
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 8px;
    }

    #ws-embed .words ul {
      columns: 2;
      padding-left: 16px;
      margin: 0;
    }

    #ws-embed .words li {
      margin: 2px 0;
    }

    #ws-embed .words li.found {
      text-decoration: line-through;
      color: #4d9958;
      font-weight: 700;
    }

    #ws-embed .footer {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
      font-size: 0.95em;
    }

    #ws-embed .muted {
      color: #666;
    }

    /* Overlay final */
    #ws-embed .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(
        ellipse at center,
        rgba(255, 255, 255, 0.88),
        rgba(255, 255, 255, 0.6)
      );
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    #ws-embed .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    #ws-embed .card {
      background: #fff;
      border: 1px solid #e7e7e7;
      border-radius: 12px;
      padding: 14px 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      text-align: center;
      max-width: 92%;
    }

    /* Fallback (pegar palabras) */
    #ws-embed .fallback {
      display: none;
      margin-top: 8px;
      gap: 6px;
    }

    #ws-embed .fallback textarea {
      width: 100%;
      min-height: 120px;
      font: inherit;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #ddd;
      background: #fff;
    }

    /* Compacto en móvil */
    @container (max-width: 560px) {
      #ws-embed .grid {
        --cell: 28px;
      }

      #ws-embed .words ul {
        columns: 1;
      }
    }

    /* ==== Dark/Light aware (usa tus tokens globales) ==== */
    #ws-embed {
      color: var(--c-text);
    }

    #ws-embed .frame,
    #ws-embed .desc,
    #ws-embed .words,
    #ws-embed .fallback textarea {
      background: var(--c-surface);
      border: var(--bd);
      color: var(--c-text);
    }

    #ws-embed .toolbar .btn {
      background: var(--c-surface);
      border: var(--bd-sm);
      color: var(--c-text);
    }

    #ws-embed .toolbar .btn[aria-pressed="true"] {
      background: color-mix(in oklab, var(--c-accent) 12%, var(--c-surface));
      border-color: color-mix(in oklab, var(--c-accent) 40%, var(--c-border));
    }

    #ws-embed .grid {
      background: var(--c-muted);
    }

    #ws-embed .cell {
      background: var(--c-surface);
      border: var(--bd-sm);
      color: var(--c-text);
    }

    #ws-embed .cell.sel {
      outline: 2px solid var(--c-accent);
      outline-offset: -2px;
      background: color-mix(in oklab, var(--c-accent) 16%, var(--c-surface));
    }

    #ws-embed .cell.found {
      /* verde sobre ambos temas, pero mezclado con surface para no “quemar” en dark */
      background: color-mix(in oklab, #2ecc71 18%, var(--c-surface));
      border-color: color-mix(in oklab, #2ecc71 40%, var(--c-border));
    }

    #ws-embed .words li.found {
      color: color-mix(in oklab, #2ecc71 70%, var(--c-text));
    }

    #ws-embed .overlay {
      /* ya es translúcido, pero en dark oscurecemos un poco más */
      background: radial-gradient(
        ellipse at center,
        color-mix(in oklab, var(--c-surface) 88%, transparent),
        color-mix(in oklab, var(--c-surface) 60%, transparent)
      );
    }

    #ws-embed .card {
      background: var(--c-surface);
      border: var(--bd);
      color: var(--c-text);
    }
  </style>

  <div class="frame">
    <p class="title">🧩 Sopa de letras</p>

    <div class="toolbar" role="toolbar" aria-label="Controles de juego">
      <div role="group" aria-label="Dificultad">
        <button class="btn dif" data-dif="easy" aria-pressed="true">
          Fácil
        </button>
        <button class="btn dif" data-dif="intermediate" aria-pressed="false">
          Intermedio
        </button>
        <button class="btn dif" data-dif="difficult" aria-pressed="false">
          Difícil
        </button>
      </div>
      <button class="btn" id="ws-new">Nueva partida</button>
    </div>

    <div class="desc" id="ws-desc">
      Elige dificultad y pulsa “Nueva partida”.
    </div>

    <div id="ws-grid" class="grid" aria-label="Tablero de letras"></div>

    <div class="aside">
      <div class="words">
        <strong>Palabras a encontrar</strong>
        <ul id="ws-words"></ul>
      </div>

      <div class="fallback" id="ws-fallback">
        <p>
          <strong>No se han encontrado archivos para esta dificultad.</strong>
          Pega aquí una lista (1ª línea: descripción; resto: palabras) y pulsa
          “Nueva partida”.
        </p>
        <textarea
          id="ws-custom"
          placeholder="Frutas&#10;Manzana&#10;Pera&#10;Plátano"
        ></textarea>
      </div>
    </div>

    <div class="footer">
      <span id="ws-status" class="muted">0/0 encontradas</span>
      <span class="muted" id="ws-file" hidden></span>
    </div>

    <div class="overlay" id="ws-overlay" aria-live="polite">
      <div class="card">
        <h3>¡Completado! 🎉</h3>
        <p id="ws-summary" class="muted"></p>
        <button class="btn" id="ws-restart">Jugar otra</button>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const root = document.getElementById("ws-embed");
      if (root.__mounted) return; // evita dobles montajes si se reinserta
      root.__mounted = true;

      // UI refs
      const gridEl = document.getElementById("ws-grid");
      const wordsEl = document.getElementById("ws-words");
      const descEl = document.getElementById("ws-desc");
      const statusEl = document.getElementById("ws-status");
      const fileEl = document.getElementById("ws-file");
      const overlayEl = document.getElementById("ws-overlay");
      const summaryEl = document.getElementById("ws-summary");
      const restartBtn = document.getElementById("ws-restart");
      const difBtns = Array.from(root.querySelectorAll(".btn.dif"));
      const newBtn = document.getElementById("ws-new");
      const fallbackBox = document.getElementById("ws-fallback");
      const customTA = document.getElementById("ws-custom");

      // Estado
      let difficulty = "easy";
      let gridSize = 10;
      let words = []; // [{raw, norm, placed, cells:[{r,c}], found}]
      let placedCount = 0;
      let board = []; // matriz letras
      let sel = { active: false, start: null, dir: null, path: [] };

      // Config por dificultad
      const CFG = {
        easy: { size: 10, tryFiles: 3 },
        intermediate: { size: 14, tryFiles: 3 },
        difficult: { size: 18, tryFiles: 3 },
      };

      const ABC = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ";

      // Normaliza tildes (preserva Ñ)
      function normalizeWord(s) {
        return s
          .replace(/ñ/gi, (m) => (m === "ñ" ? "##enye##" : "##ENYE##"))
          .normalize("NFD")
          .replace(/\p{Diacritic}/gu, "")
          .replace(/##enye##/g, "Ñ")
          .replace(/##ENYE##/g, "Ñ")
          .toUpperCase()
          .replace(/[^A-ZÑ]/g, "");
      }

      // ----------- Carga de archivo aleatorio -----------
      async function pickRandomFileForDifficulty(dif) {
        const maxTry = CFG[dif].tryFiles;
        const okList = [];
        for (let i = 1; i <= maxTry; i++) {
          const url = `assets/main/crosswords/${dif}${i}.txt`;
          try {
            const res = await fetch(url, { cache: "no-store" });
            if (res.ok) okList.push({ url, res });
          } catch {}
        }
        if (okList.length === 0) return null;
        const k = (Math.random() * okList.length) | 0;
        const txt = await okList[k].res.text();
        return { url: okList[k].url, text: txt };
      }

      function parsePuzzleText(txt) {
        const lines = txt
          .split(/\r?\n/)
          .map((l) => l.trim())
          .filter(Boolean);
        if (lines.length === 0) return { desc: "—", words: [] };
        const desc = lines[0];
        const list = lines.slice(1);
        const out = list
          .map((w) => ({
            raw: w,
            norm: normalizeWord(w),
            placed: false,
            cells: [],
            found: false,
          }))
          .filter((w) => w.norm.length > 0);
        return { desc, words: out };
      }

      // ----------- Construcción del tablero -----------
      function emptyBoard(n) {
        return Array.from({ length: n }, () =>
          Array.from({ length: n }, () => "")
        );
      }

      const DIRS = [
        { dr: 0, dc: 1 },
        { dr: 1, dc: 0 },
        { dr: 0, dc: -1 },
        { dr: -1, dc: 0 },
        { dr: 1, dc: 1 },
        { dr: -1, dc: 1 },
        { dr: 1, dc: -1 },
        { dr: -1, dc: -1 },
      ];

      function canPlace(word, r, c, dir, n) {
        for (let i = 0; i < word.length; i++) {
          const rr = r + dir.dr * i,
            cc = c + dir.dc * i;
          if (rr < 0 || rr >= n || cc < 0 || cc >= n) return false;
          const cell = board[rr][cc];
          if (cell !== "" && cell !== word[i]) return false;
        }
        return true;
      }

      function placeWord(wObj, n) {
        const W = wObj.norm;
        for (let tries = 0; tries < 200; tries++) {
          const dir = DIRS[(Math.random() * DIRS.length) | 0];
          const r0 = (Math.random() * n) | 0,
            c0 = (Math.random() * n) | 0;
          if (!canPlace(W, r0, c0, dir, n)) continue;
          const cells = [];
          for (let i = 0; i < W.length; i++) {
            const rr = r0 + dir.dr * i,
              cc = c0 + dir.dc * i;
            board[rr][cc] = W[i];
            cells.push({ r: rr, c: cc });
          }
          wObj.placed = true;
          wObj.cells = cells;
          return true;
        }
        return false;
      }

      function fillFiller(n) {
        for (let r = 0; r < n; r++)
          for (let c = 0; c < n; c++)
            if (!board[r][c])
              board[r][c] = ABC[(Math.random() * ABC.length) | 0];
      }

      // ----------- Pintado -----------
      function drawBoard(n) {
        gridEl.style.gridTemplateColumns = `repeat(${n}, var(--cell))`;
        gridEl.innerHTML = "";
        for (let r = 0; r < n; r++)
          for (let c = 0; c < n; c++) {
            const d = document.createElement("div");
            d.className = "cell";
            d.dataset.r = r;
            d.dataset.c = c;
            d.textContent = board[r][c];
            gridEl.appendChild(d);
          }
      }

      function drawWordList() {
        wordsEl.innerHTML = "";
        for (const w of words) {
          const li = document.createElement("li");
          li.textContent = w.raw;
          li.dataset.word = w.norm;
          if (w.found) li.classList.add("found");
          wordsEl.appendChild(li);
        }
        statusEl.textContent = `${placedCount}/${words.length} encontradas`;
      }

      // ----------- Selección por arrastre (parche final) -----------
      function getCell(el) {
        if (!el || !el.classList.contains("cell")) return null;
        return { r: +el.dataset.r, c: +el.dataset.c, el };
      }
      function cellFromPoint(x, y) {
        const el = document.elementFromPoint(x, y);
        return getCell(el?.closest(".cell"));
      }
      function paintSelection(path) {
        gridEl
          .querySelectorAll(".cell.sel")
          .forEach((el) => el.classList.remove("sel"));
        for (const p of path) {
          const el = gridEl.querySelector(
            `.cell[data-r="${p.r}"][data-c="${p.c}"]`
          );
          if (el) el.classList.add("sel");
        }
      }
      function clearSelection() {
        sel.active = false;
        sel.start = null;
        sel.dir = null;
        sel.path.length = 0;
        gridEl
          .querySelectorAll(".cell.sel")
          .forEach((el) => el.classList.remove("sel"));
      }
      function pathToString(path) {
        return path.map((p) => board[p.r][p.c]).join("");
      }
      function tryMatchPath(path) {
        if (path.length < 2) return false;
        const s = pathToString(path);
        const rs = s.split("").reverse().join("");
        const target = words.find(
          (w) => !w.found && (w.norm === s || w.norm === rs)
        );
        if (!target) return false;

        // pinta celdas encontradas
        for (const p of path) {
          const el = gridEl.querySelector(
            `.cell[data-r="${p.r}"][data-c="${p.c}"]`
          );
          if (el) el.classList.add("found");
        }
        target.found = true;
        placedCount++;
        const li = wordsEl.querySelector(`li[data-word="${target.norm}"]`);
        if (li) li.classList.add("found");

        statusEl.textContent = `${placedCount}/${words.length} encontradas`;
        if (placedCount === words.length) {
          summaryEl.textContent = `Has encontrado ${placedCount} palabras.`;
          overlayEl.classList.add("show");
        }
        return true;
      }
      function sign(n) {
        return n === 0 ? 0 : n > 0 ? 1 : -1;
      }

      gridEl.addEventListener("pointerdown", (e) => {
        const cell = getCell(e.target) || cellFromPoint(e.clientX, e.clientY);
        if (!cell) return;
        e.preventDefault();
        clearSelection();
        sel.active = true;
        sel.start = { r: cell.r, c: cell.c };
        sel.dir = null;
        sel.path = [{ r: cell.r, c: cell.c }];
        paintSelection(sel.path);
        gridEl.setPointerCapture(e.pointerId);
      });

      gridEl.addEventListener("pointermove", (e) => {
        if (!sel.active) return;
        const cell = cellFromPoint(e.clientX, e.clientY);
        if (!cell) return;

        // Fijar dirección con la segunda celda
        if (!sel.dir) {
          const dr = sign(cell.r - sel.start.r);
          const dc = sign(cell.c - sel.start.c);
          if (dr === 0 && dc === 0) return; // sigue sobre la inicial
          sel.dir = { dr, dc };
        }

        // Reconstruye línea recta desde start hasta la celda actual
        const path = [];
        let r = sel.start.r,
          c = sel.start.c;
        path.push({ r, c });
        while (r !== cell.r || c !== cell.c) {
          r += sel.dir.dr;
          c += sel.dir.dc;
          if (r < 0 || r >= gridSize || c < 0 || c >= gridSize) break;
          path.push({ r, c });
          // El “snap” mantiene el trazo recto aunque el dedo vaya zigzagueando
        }
        sel.path = path;
        paintSelection(sel.path);
      });

      gridEl.addEventListener("pointerup", (e) => {
        if (!sel.active) return;
        tryMatchPath(sel.path);
        clearSelection();
        gridEl.releasePointerCapture(e.pointerId);
      });
      gridEl.addEventListener("pointercancel", clearSelection);

      // ----------- Controles y flujo -----------
      restartBtn.addEventListener("click", () => startNewGame(difficulty));

      difBtns.forEach((btn) => {
        btn.addEventListener("click", () => {
          difBtns.forEach((b) => b.setAttribute("aria-pressed", "false"));
          btn.setAttribute("aria-pressed", "true");
          difficulty = btn.dataset.dif;
        });
      });

      newBtn.addEventListener("click", () => startNewGame(difficulty));

      async function startNewGame(dif) {
        overlayEl.classList.remove("show");
        fileEl.textContent = "";
        descEl.textContent = "Cargando…";
        fallbackBox.style.display = "none";

        const cfg = CFG[dif] || CFG.easy;
        gridSize = cfg.size;

        let data = await pickRandomFileForDifficulty(dif);
        if (!data) {
          const txt = customTA.value.trim();
          if (!txt) {
            fallbackBox.style.display = "grid";
            descEl.textContent =
              "No hay archivos disponibles para esta dificultad.";
            gridEl.innerHTML = "";
            wordsEl.innerHTML = "";
            statusEl.textContent = "0/0 encontradas";
            return;
          }
          data = { url: "(personalizado)", text: txt };
        }

        const parsed = parsePuzzleText(data.text);
        words = parsed.words.slice(0, 60); // tope razonable
        if (words.length < 5) {
          while (words.length < 5 && parsed.words.length > 0) {
            words.push({ ...parsed.words[words.length % parsed.words.length] });
          }
        }

        // Construir tablero con posible crecimiento si no cabe
        let success = false;
        for (let grow = 0; grow < 3 && !success; grow++) {
          const n = gridSize + grow * 2;
          board = emptyBoard(n);
          const byLen = [...words].sort(
            (a, b) => b.norm.length - a.norm.length
          );
          byLen.forEach((w) => {
            w.placed = false;
            w.cells = [];
          });
          let allOk = true;
          for (const w of byLen) {
            if (!placeWord(w, n)) {
              allOk = false;
              break;
            }
          }
          if (allOk) {
            const placedMap = Object.fromEntries(byLen.map((w) => [w.norm, w]));
            words.forEach((w) => {
              const ref = placedMap[w.norm];
              w.placed = ref.placed;
              w.cells = ref.cells;
            });
            fillFiller(n);
            gridSize = n;
            success = true;
          }
        }

        if (!success) {
          // Quita 2 palabras largas y reintenta en tamaño base
          const n = gridSize;
          board = emptyBoard(n);
          const reduced = [...words]
            .sort((a, b) => b.norm.length - a.norm.length)
            .slice(2);
          reduced.forEach((w) => {
            w.placed = false;
            w.cells = [];
          });
          let allOk = true;
          for (const w of reduced) {
            if (!placeWord(w, n)) {
              allOk = false;
              break;
            }
          }
          if (!allOk) {
            descEl.textContent =
              "No se pudo construir el tablero con las palabras dadas.";
            gridEl.innerHTML = "";
            wordsEl.innerHTML = "";
            statusEl.textContent = "0/0 encontradas";
            return;
          }
          words = reduced;
          fillFiller(n);
        }

        // Reset encontrados
        words.forEach((w) => (w.found = false));
        placedCount = 0;

        // Pintar
        descEl.textContent = parsed.desc;
        fileEl.textContent = data.url;
        drawBoard(gridSize);
        drawWordList();
      }

      // Arranque
      startNewGame(difficulty);
    })();
  </script>
</div>
