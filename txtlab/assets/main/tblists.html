<div id="imenu" class="box control">
  <i class="fa-solid fa-magnifying-glass"></i>
  <input
    type="text"
    id="searchtext"
    placeholder="Busca..."
    data-i18n-placeholder="search_placeholder"
  />
  <button data-action="copyi" data-i18n-title="copyi_title" title="Copiar">
    <i class="fa-regular fa-copy"></i>
  </button>
  <button data-action="pastei" data-i18n-title="pastei_title" title="Pegar">
    <i class="fa-regular fa-paste"></i>
  </button>
  <button
    data-action="cleanleft"
    data-i18n-title="cleanleft_title"
    title="Limpiar"
  >
    <i class="fa-solid fa-xmark"></i>
  </button>
  <button
    data-action="lefttoright"
    data-i18n-title="lefttoright_title"
    title="Pasar a la derecha"
  >
    <i class="fa-solid fa-arrow-right"></i>
  </button>
</div>
<div id="omenu" class="box control">
  <button
    data-action="righttoleft"
    data-i18n-title="righttoleft_title"
    title="Pasar a la izquierda"
  >
    <i class="fa-solid fa-arrow-left"></i>
  </button>
  <button
    data-action="cleanright"
    data-i18n-title="cleanright_title"
    title="Limpiar"
  >
    <i class="fa-solid fa-xmark"></i>
  </button>
  <button data-action="copyo" data-i18n-title="copyo_title" title="Copiar">
    <i class="fa-regular fa-copy"></i>
  </button>
  <button data-action="pasteo" data-i18n-title="pasteo_title" title="Pegar">
    <i class="fa-regular fa-paste"></i>
  </button>
  <button data-action="printo" data-i18n-title="printo_title" title="Imprimir">
    <i class="fa-solid fa-print"></i>
  </button>
</div>
<textarea id="itext" class="box">Escribe o pega aquí tu lista.</textarea>
<textarea id="otext" class="box"></textarea>
<div id="statusi" class="metainfo" data-i18n="status_i"></div>
<div id="statuso" class="metainfo" data-i18n="status_o"></div>
