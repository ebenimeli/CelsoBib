<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego de Letras Infantil</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      margin: 0;
      font-family: sans-serif;
      background-color: #f0f0f0;
    }

    /* PANEL SUPERIOR */
    #top-panel {
      width: 100%;
      background: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      padding: 10px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #top-panel button {
      padding: 8px 12px;
      font-size: 1em;
      cursor: pointer;
    }
    /* Contenedor de las imágenes de palabras */
    #image-buttons {
      margin-left: auto;              /* empuja a la derecha */
      display: flex;
      gap: 8px;
    }
    #image-buttons .word-icon {
      width: 50px;                    /* cuadrado */
      height: 50px;
      object-fit: cover;
      border: 2px solid #ddd;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.1s;
    }
    #image-buttons .word-icon:hover {
      transform: scale(1.1);
      border-color: #aaa;
    }

    /* PANEL CENTRAL */
    #panel {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 20px;
      box-sizing: border-box;
    }
    #panel img,
    #panel .blank {
      object-fit: contain;
      height: auto;
      box-sizing: border-box;
    }
    #panel .blank {
      border: 2px dashed #ccc;
      background-color: #fff;
    }

    /* PANEL INFERIOR */
    #input-area {
      width: 100%;
      padding: 10px;
      background: #fff;
      box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
      box-sizing: border-box;
    }
    #wordInput {
      width: 100%;
      padding: 10px;
      font-size: 1.2em;
      box-sizing: border-box;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <!-- Panel superior con botón y 10 imágenes -->
  <div id="top-panel">
    <button id="pickWordBtn">Siguiente palabra</button>
    <div id="image-buttons">
      <img src="images/spidey.jpg" alt="Palabra 1" data-word="SPIDEY" class="word-icon">
      <img src="images/spin.jpg" alt="Palabra 2" data-word="SPIN" class="word-icon">
      <img src="images/fantasma.jpg" alt="Palabra 3" data-word="FANTASMA" class="word-icon">
      <img src="images/hulk.jpg" alt="Palabra 4" data-word="HULK" class="word-icon">
      <img src="images/duende.jpg" alt="Palabra 5" data-word="DUENDE VERDE" class="word-icon">
      <img src="images/doc_ock.jpg" alt="Palabra 6" data-word="DOC OCK" class="word-icon">
      <img src="images/rhino.jpg" alt="Palabra 7" data-word="RHINO" class="word-icon">

      <!--
      <img src="images/placeholder8.jpg" alt="Palabra 8" data-word="PALABRA8" class="word-icon">
      <img src="images/placeholder9.jpg" alt="Palabra 9" data-word="PALABRA9" class="word-icon">
      <img src="images/placeholder10.jpg" alt="Palabra 10" data-word="PALABRA10" class="word-icon">
        -->
    </div>
  </div>

  <!-- Panel central de imágenes -->
  <div id="panel"></div>

  <!-- Panel inferior con cuadro de texto -->
  <div id="input-area">
    <input
      type="text"
      id="wordInput"
      placeholder="Escribe una palabra..."
      autocomplete="off"
    />
  </div>

  <script>
    const panel = document.getElementById('panel');
    const input = document.getElementById('wordInput');
    const pickBtn = document.getElementById('pickWordBtn');
    const wordIcons = document.querySelectorAll('.word-icon');

    const wordList = ['GATO', 'PERRO', 'CASA', 'SOL', 'LUNA'];
    let currentIndex = 0;

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const lowFreq = 220;
    const highFreq = 880;

    function playNote(letter) {
      const index = letter.charCodeAt(0) - 65;
      const freq = lowFreq + (index / 25) * (highFreq - lowFreq);
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }

    function playDeleteSound() {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 100;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    function updatePanel() {
      const value = input.value;
      panel.innerHTML = '';
      if (!value) return;
      const letters = value.split('');
      const count = letters.length;
      const effectiveCount = count < 3 ? 3 : count;
      const widthPercent = 100 / effectiveCount;
      letters.forEach(letter => {
        if (letter === ' ') {
          const blank = document.createElement('div');
          blank.className = 'blank';
          blank.style.flex = `0 0 ${widthPercent}%`;
          blank.style.margin = '2px';
          blank.style.aspectRatio = '1/1';
          panel.appendChild(blank);
        } else if (letter.match(/[A-Z]/)) {
          const img = document.createElement('img');
          img.src = `images/letters/letter_${letter}.jpg`;
          img.alt = letter;
          img.style.flex = `0 0 ${widthPercent}%`;
          img.style.maxWidth = `${widthPercent}%`;
          img.style.margin = '2px';
          panel.appendChild(img);
        }
      });
    }

    // Siguiente palabra
    pickBtn.addEventListener('click', () => {
      const next = wordList[currentIndex];
      currentIndex = (currentIndex + 1) % wordList.length;
      input.value = next;
      updatePanel();
    });

    // Clic en cada imagen de palabra
    wordIcons.forEach(img => {
      img.addEventListener('click', () => {
        input.value = img.dataset.word;
        updatePanel();
      });
    });

    // Sonido al borrar
    input.addEventListener('keydown', e => {
      if (e.key === 'Backspace' || e.key === 'Delete') {
        playDeleteSound();
      }
    });

    // Mayúsculas, nota y actualización
    input.addEventListener('input', e => {
      input.value = input.value.toUpperCase();
      const char = e.data ? e.data.toUpperCase() : null;
      if (char && char.match(/[A-Z]/)) playNote(char);
      updatePanel();
    });
  </script>
</body>
</html>
