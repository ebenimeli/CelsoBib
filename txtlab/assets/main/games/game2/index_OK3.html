<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Juego de Letras Infantil</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      margin: 0;
      font-family: sans-serif;
      background-color: #f0f0f0;
    }
    #panel {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 20px;
      box-sizing: border-box;
    }
    #panel img,
    #panel .blank {
      object-fit: contain;
      height: auto;
      box-sizing: border-box;
    }
    /* Estilo para hueco en blanco */
    #panel .blank {
      border: 2px dashed #ccc;
      background-color: #fff;
    }
    #input-area {
      width: 100%;
      padding: 10px;
      background: #fff;
      box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
      box-sizing: border-box;
    }
    #wordInput {
      width: 100%;
      padding: 10px;
      font-size: 1.2em;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div id="panel"></div>

  <div id="input-area">
    <input type="text" id="wordInput" placeholder="Escribe una palabra..." autocomplete="off" />
  </div>

  <script>
    const panel = document.getElementById('panel');
    const input = document.getElementById('wordInput');

    // Inicializar AudioContext
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const lowFreq = 220;  // Frecuencia para 'A'
    const highFreq = 880; // Frecuencia para 'Z'

    function playNote(letter) {
      const index = letter.charCodeAt(0) - 65; // 0..25
      const freq = lowFreq + (index / 25) * (highFreq - lowFreq);
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }

    function updatePanel() {
      const value = input.value.toUpperCase();
      panel.innerHTML = '';
      if (!value) return;

      const letters = value.split('');
      const count = letters.length;
      // Si hay menos de 3 letras, tratamos como si fuesen 3 para calcular el ancho
      const effectiveCount = count < 3 ? 3 : count;
      const widthPercent = 100 / effectiveCount;

      letters.forEach(letter => {
        if (letter === ' ') {
          const blank = document.createElement('div');
          blank.className = 'blank';
          blank.style.flex = `0 0 ${widthPercent}%`;
          blank.style.margin = '2px';
          blank.style.aspectRatio = '1/1';
          panel.appendChild(blank);
        } else if (letter.match(/[A-Z]/)) {
          const img = document.createElement('img');
          img.src = `images/letters/letter_${letter}.jpg`;
          img.alt = letter;
          img.style.flex = `0 0 ${widthPercent}%`;
          img.style.maxWidth = `${widthPercent}%`;
          img.style.margin = '2px';
          panel.appendChild(img);
        }
      });
    }

    input.addEventListener('input', (e) => {
      const char = e.data ? e.data.toUpperCase() : null;
      if (char && char.match(/[A-Z]/)) {
        playNote(char);
      }
      updatePanel();
    });
  </script>
</body>
</html>
