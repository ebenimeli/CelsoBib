<section id="at-root" class="game-root timer-page" aria-labelledby="at-title">
  <!-- Barra de control (fila única) -->
  <div class="timer-controls" role="toolbar" aria-label="Controles del temporizador">
    <h2 id="at-title" class="sr-only">Temporizador analógico</h2>

    <label for="at-duration" class="sr-only">Duración (h:mm:ss o mm:ss)</label>
    <input
      id="at-duration"
      class="dt-input"
      type="text"
      inputmode="numeric"
      autocomplete="off"
      placeholder="00:05:00"
      aria-label="Duración en formato horas:minutos:segundos"
      value="00:05:00"
      pattern="^\\d{1,2}:\\d{2}(:\\d{2})?$"
      title="Usa h:mm:ss o mm:ss (por ejemplo, 00:05:00 o 05:00)"
    />

    <button id="at-dec" class="action ghost" type="button" title="−1 minuto">
      <i class="fa-solid fa-minus" aria-hidden="true"></i><span class="lbl"></span>
    </button>
    <button id="at-inc" class="action ghost" type="button" title="+1 minuto">
      <i class="fa-solid fa-plus" aria-hidden="true"></i><span class="lbl"></span>
    </button>

    <button id="at-start" class="action" type="button" title="Iniciar (Espacio)">
      <i class="fa-solid fa-play" aria-hidden="true"></i><span class="lbl">Iniciar</span>
    </button>

    <button id="at-pause" class="action" type="button" title="Pausar (Espacio)" disabled>
      <i class="fa-solid fa-pause" aria-hidden="true"></i><span class="lbl">Pausar</span>
    </button>

    <button id="at-reset" class="action ghost" type="button" title="Reiniciar (R)">
      <i class="fa-solid fa-rotate-left" aria-hidden="true"></i><span class="lbl"></span>
    </button>

    <button id="at-fs" class="action" type="button" title="Pantalla completa (F)">
      <i class="fa-solid fa-expand" aria-hidden="true"></i><span class="lbl"></span>
    </button>
  </div>

  <!-- Botón salir (visible en pantalla completa) -->
  <button id="at-fs-exit" class="dt-fs-exit" type="button" title="Salir de pantalla completa (Esc)">
    <i class="fa-solid fa-xmark" aria-hidden="true"></i><span class="sr-only">Salir</span>
  </button>

  <!-- Cara del temporizador (anillo analógico) -->
  <div class="timer-face" role="timer" aria-live="polite" aria-atomic="true">
    <div class="analog" role="img" aria-label="Progreso del temporizador">
      <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
        <!-- Pista -->
        <circle class="track" cx="60" cy="60" r="54" />
        <!-- Relleno (progreso) -->
        <circle id="at-arc" class="arc" cx="60" cy="60" r="54" />
      </svg>
      <div class="center">
        <span id="at-time" class="time">00:05:00</span>
      </div>
    </div>
  </div>

  <!-- Presets de duración (UNA SOLA LÍNEA con scroll si no caben) -->
  <div class="timer-presets" role="group" aria-label="Duraciones rápidas">
    <button class="action ghost preset" data-seconds="30">30 s</button>
    <button class="action ghost preset" data-seconds="60">1 min</button>
    <button class="action ghost preset" data-seconds="300">5 min</button>
    <button class="action ghost preset" data-seconds="600">10 min</button>
    <button class="action ghost preset" data-seconds="1800">30 min</button>
    <button class="action ghost preset" data-seconds="3600">1 hora</button>
  </div>
</section>

<style>
  /* Accesible: oculto visualmente pero presente para lectores de pantalla */
  .sr-only {
    position: absolute !important;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0);
    white-space: nowrap; border: 0;
  }

  /* Contenedor principal: ocupa todo el ancho de #main y deja un pequeño margen interno */
  .timer-page {
    width: 100%;
    display: block;
    padding: clamp(8px, 2vw, 16px);
    box-sizing: border-box;
  }

  /* Barra de control en una sola fila (scroll-x si el viewport es muy estrecho) */
  .timer-controls {
    display: flex;
    align-items: center;
    gap: .5rem;
    flex-wrap: nowrap;
    margin-bottom: .75rem;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 2px;
  }
  .timer-controls .lbl { margin-left: .35rem; }

  .dt-input {
    width: 10ch;             /* h:mm:ss */
    min-width: 12ch;
    text-align: center;
    font: inherit;
    font-variant-numeric: tabular-nums;
    padding: .4rem .55rem;
    border: 1px solid var(--c-border, #ccc);
    border-radius: .5rem;
    background: var(--c-surface, transparent);
    color: var(--c-text, #111);
    outline-offset: 2px;
  }
  .dt-input:invalid {
    outline: 2px solid color-mix(in srgb, #ff4d4f 60%, transparent);
    outline-offset: 2px;
  }

  /* Cara del temporizador */
  .timer-face {
    width: 100%;
    min-height: clamp(220px, 45vw, 520px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(12px, 3vw, 24px);
    border: 1px solid var(--c-border, rgba(0,0,0,.15));
    border-radius: 12px;
    background: var(--c-bg, transparent);
    color: var(--c-text, #111);
    box-sizing: border-box;
  }
  .timer-face.done {
    border-color: var(--c-accent, steelblue);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--c-accent, steelblue) 20%, transparent) inset;
  }

  /* Análogo: anillo */
  .analog {
    position: relative;
    width: min(84vmin, 92vw, 560px);
    aspect-ratio: 1 / 1;
  }
  .ring { width: 100%; height: 100%; display: block; transform: rotate(-90deg); }

  .track,
  .arc {
    fill: none;
    stroke-linecap: round;
    stroke-width: 12;
  }
  .track {
    stroke: color-mix(in oklab, var(--c-border, rgba(0,0,0,.2)) 55%, transparent);
  }
  .arc {
    stroke: var(--c-accent, steelblue);
    stroke-dasharray: 339.292;     /* 2πr con r=54 */
    stroke-dashoffset: 339.292;    /* 100% sin rellenar (progreso 0) */
    transition: stroke-dashoffset .18s linear;
  }

  .center {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: clamp(8px, 2vw, 12px);
  }

  .time {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Roboto Mono", monospace;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    font-weight: 600;
    line-height: 1;
    font-size: clamp(32px, 8vw, 80px);
    text-align: center;
  }

  /* Presets: una sola línea + scroll horizontal si no caben */
  .timer-presets {
    display: flex;
    flex-wrap: nowrap;
    gap: .5rem;
    justify-content: flex-start;
    margin-top: .75rem;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding-block: 2px;
  }

  /* Botón de salida de pantalla completa */
  .dt-fs-exit {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top, 0px));
    right: calc(12px + env(safe-area-inset-right, 0px));
    z-index: 10000;
    display: none; /* visible solo en fullscreen */
    align-items: center;
    justify-content: center;
    width: 44px; height: 44px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,.25);
    background: rgba(0,0,0,.45);
    color: #fff;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    cursor: pointer;
  }

  /* Mostrar botón X cuando estamos en FS (via clase is-fs o pseudo-class) */
  #at-root.is-fs .dt-fs-exit { display: inline-flex; }
  #at-root:fullscreen  .dt-fs-exit,
  #at-root:-webkit-full-screen .dt-fs-exit,
  #at-root:-moz-full-screen .dt-fs-exit { display: inline-flex; }

  /* Pantalla completa: centrar verticalmente el anillo */
  #at-root.is-fs,
  #at-root:fullscreen,
  #at-root:-webkit-full-screen,
  #at-root:-moz-full-screen {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding: clamp(8px, 2vw, 16px);
    box-sizing: border-box;
  }
  #at-root.is-fs .timer-controls,
  #at-root:fullscreen .timer-controls,
  #at-root:-webkit-full-screen .timer-controls,
  #at-root:-moz-full-screen .timer-controls {
    margin-bottom: .75rem;
  }
  #at-root.is-fs .timer-face,
  #at-root:fullscreen .timer-face,
  #at-root:-webkit-full-screen .timer-face,
  #at-root:-moz-full-screen .timer-face {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* En pantallas pequeñas, oculta labels para mantener una sola fila */
  @media (max-width: 560px) {
    .timer-controls .lbl { display: none; }
  }
</style>

<script>
(function () {
  /* --------- DOM refs --------- */
  const root     = document.getElementById("at-root");
  const elTime   = document.getElementById("at-time");
  const inDur    = document.getElementById("at-duration");
  const btnInc   = document.getElementById("at-inc");
  const btnDec   = document.getElementById("at-dec");
  const btnStart = document.getElementById("at-start");
  const btnPause = document.getElementById("at-pause");
  const btnReset = document.getElementById("at-reset");
  const btnFS    = document.getElementById("at-fs");
  const btnFSx   = document.getElementById("at-fs-exit");
  const face     = root.querySelector(".timer-face");
  const presets  = root.querySelector(".timer-presets");
  const arc      = document.getElementById("at-arc");

  /* --------- Estado --------- */
  let total = 5 * 60;         // 5 minutos por defecto
  let remaining = total;
  let running = false;
  let ticker = null;
  let deadline = 0;

  // Geometría del arco (r=54 → C ≈ 339.292)
  const CIRC = 2 * Math.PI * 54; // 339.292...
  arc.style.strokeDasharray = String(CIRC);
  arc.style.strokeDashoffset = String(CIRC); // progreso 0 (sin rellenar)

  // Sonido
  let audioCtx = null;
  let lastBeepSec = null;
  function ensureAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  }
  function beep({ freq = 880, dur = 0.08, type = "sine", gain = 0.06 } = {}) {
    if (!audioCtx) return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.value = 0;
    o.connect(g); g.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    g.gain.linearRampToValueAtTime(gain, now + 0.005);
    g.gain.linearRampToValueAtTime(0.0001, now + dur);
    o.start(now); o.stop(now + dur + 0.02);
  }
  function beepTick() { beep({ freq: 900, dur: 0.06, type: "sine", gain: 0.07 }); }
  function beepFinal() {
    if (!audioCtx) return;
    const steps = [
      { t: 0.00, f: 660, d: 0.08 },
      { t: 0.09, f: 880, d: 0.10 },
      { t: 0.21, f: 660, d: 0.16 }
    ];
    steps.forEach(s => setTimeout(() => beep({ freq: s.f, dur: s.d, type: "sine", gain: 0.09 }), s.t * 1000));
  }

  /* --------- Utils --------- */
  const clamp = (n, min, max) => Math.min(max, Math.max(min, n));
  const pad2 = (n) => String(n).padStart(2, "0");
  const fmtHMS = (s) => {
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = Math.max(0, s % 60);
    return `${pad2(h)}:${pad2(m)}:${pad2(sec)}`;
  };

  function setDisplay(seconds) { elTime.textContent = fmtHMS(seconds); }
  function updateButtons() { btnStart.disabled = running; btnPause.disabled = !running; }
  function syncDurationInput() { inDur.value = fmtHMS(total); }

  function setProgressElapsed(pct) {
    // pct: 0..100 (transcurrido). 0 = sin rellenar, 100 = anillo completo
    const p = clamp(pct, 0, 100);
    const offset = CIRC * (1 - p / 100);
    arc.style.strokeDashoffset = String(offset);
  }
  function updateRing() {
    const elapsed = total > 0 ? total - remaining : 0;
    const pct = total > 0 ? (elapsed / total) * 100 : 0;
    setProgressElapsed(pct);
  }

  // Parse de input h:mm:ss o mm:ss
  function parseHMS(str) {
    if (!str) return null;
    const t = String(str).trim();
    let m = t.match(/^(\d{1,2}):(\d{2}):(\d{2})$/);
    if (m) {
      const h = parseInt(m[1], 10), mi= parseInt(m[2], 10), s = parseInt(m[3], 10);
      if (mi > 59 || s > 59) return null;
      return h * 3600 + mi * 60 + s;
    }
    m = t.match(/^(\d{1,2}):(\d{2})$/); // mm:ss
    if (m) {
      const mi= parseInt(m[1], 10), s = parseInt(m[2], 10);
      if (mi > 59 || s > 59) return null;
      return mi * 60 + s;
    }
    return null;
  }

  /* --------- Temporización con corrección de deriva --------- */
  function tick() {
    const now = Date.now();
    const secs = Math.max(0, Math.ceil((deadline - now) / 1000));
    if (secs !== remaining) {
      remaining = secs;
      setDisplay(remaining);
      updateRing();

      if (remaining <= 10 && remaining > 0 && remaining !== lastBeepSec) {
        lastBeepSec = remaining;
        beepTick();
      }
    }

    if (remaining <= 0) {
      stop(false);
      face.classList.add("done");
      setProgressElapsed(100); // anillo completo al terminar
      beepFinal();
      return;
    }

    ticker = setTimeout(tick, 200);
  }

  function start() {
    if (running) return;
    if (remaining <= 0) remaining = total;
    running = true;
    face.classList.remove("done");
    ensureAudio();
    lastBeepSec = null;
    deadline = Date.now() + remaining * 1000;
    setDisplay(remaining);
    updateButtons();
    updateRing();
    tick();
  }
  function pause() {
    if (!running) return;
    remaining = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
    running = false;
    updateButtons();
    clearTimeout(ticker);
    ticker = null;
    updateRing();
  }
  function stop(userInitiated = true) {
    running = false;
    updateButtons();
    clearTimeout(ticker);
    ticker = null;
    if (userInitiated) { /* sin beep final */ }
  }
  function reset() {
    stop(true);
    remaining = total;
    face.classList.remove("done");
    setDisplay(remaining);
    setProgressElapsed(0); // vuelve a 0% progreso (sin rellenar)
  }

  /* --------- Cambiar duración --------- */
  function setDurationSeconds(secs, { stopIfRunning = true } = {}) {
    secs = clamp(Math.floor(secs), 1, 99 * 3600 + 59 * 60 + 59);
    total = secs;
    syncDurationInput();
    if (running && !stopIfRunning) {
      const now = Date.now();
      const rem = Math.max(0, Math.ceil((deadline - now) / 1000));
      const elapsed = clamp(total - rem, 0, total);
      remaining = clamp(total - elapsed, 0, total);
      deadline = now + remaining * 1000;
    } else {
      stop(true);
      remaining = total;
    }
    face.classList.remove("done");
    setDisplay(remaining);
    setProgressElapsed(0);
  }
  function applyDurationFromInput() {
    const secs = parseHMS(inDur.value);
    if (secs == null || secs <= 0) return;
    setDurationSeconds(secs, { stopIfRunning: true });
  }
  function incMinute() {
    if (running) {
      total = clamp(total + 60, 1, 99*3600 + 59*60 + 59);
      syncDurationInput();
      deadline += 60 * 1000;
      const rem = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
      setDisplay(rem);
      updateRing();
    } else {
      setDurationSeconds(total + 60, { stopIfRunning: true });
    }
  }
  function decMinute() {
    if (running) {
      total = clamp(total - 60, 1, 99*3600 + 59*60 + 59);
      syncDurationInput();
      deadline -= 60 * 1000;
      const rem = Math.max(1, Math.ceil((deadline - Date.now()) / 1000));
      deadline = Date.now() + rem * 1000;
      setDisplay(rem);
      updateRing();
    } else {
      setDurationSeconds(Math.max(1, total - 60), { stopIfRunning: true });
    }
  }

  /* --------- Pantalla completa --------- */
  const isFS = () => document.fullscreenElement === root
                 || document.webkitFullscreenElement === root
                 || document.mozFullScreenElement === root;

  async function enterFS() {
    try {
      if (root.requestFullscreen) await root.requestFullscreen({ navigationUI: "hide" });
      else if (root.webkitRequestFullscreen) root.webkitRequestFullscreen();
      else if (root.mozRequestFullScreen) root.mozRequestFullScreen();
    } catch (e) { console.warn("[at] No se pudo poner en pantalla completa:", e); }
  }
  async function exitFS() {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else if (document.webkitFullscreenElement && document.webkitExitFullscreen) document.webkitExitFullscreen();
      else if (document.mozFullScreenElement && document.mozCancelFullScreen) document.mozCancelFullScreen();
    } catch (e) { console.warn("[at] No se pudo salir de pantalla completa:", e); }
  }
  function toggleFS() { isFS() ? exitFS() : enterFS(); }
  function onFSChange() {
    if (isFS()) {
      root.classList.add("is-fs");
      btnFS.querySelector("i")?.classList.replace("fa-expand", "fa-compress");
      btnFS.title = "Salir de pantalla completa (F)";
      const lbl = btnFS.querySelector(".lbl"); if (lbl) lbl.textContent = "Salir de pant. completa";
    } else {
      root.classList.remove("is-fs");
      btnFS.querySelector("i")?.classList.replace("fa-compress", "fa-expand");
      btnFS.title = "Pantalla completa (F)";
      const lbl = btnFS.querySelector(".lbl"); if (lbl) lbl.textContent = "";
    }
  }

  /* --------- Eventos --------- */
  btnStart.addEventListener("click", start);
  btnPause.addEventListener("click", pause);
  btnReset.addEventListener("click", reset);
  btnFS.addEventListener("click", toggleFS);
  btnFSx.addEventListener("click", exitFS);
  document.addEventListener("fullscreenchange", onFSChange);

  inDur.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); applyDurationFromInput(); }
    else if (e.key.toLowerCase() === "r") { e.preventDefault(); reset(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); incMinute(); }
    else if (e.key === "ArrowDown") { e.preventDefault(); decMinute(); }
  });
  inDur.addEventListener("blur", applyDurationFromInput);

  btnInc.addEventListener("click", incMinute);
  btnDec.addEventListener("click", decMinute);

  // Presets
  presets.addEventListener("click", (e) => {
    const btn = e.target.closest("button.preset[data-seconds]");
    if (!btn) return;
    const secs = parseInt(btn.getAttribute("data-seconds"), 10);
    if (Number.isFinite(secs)) {
      setDurationSeconds(secs, { stopIfRunning: true });
      // start(); // ← descomenta si quieres que arranque automáticamente tras elegir preset
    }
  });

  // Atajos globales: Espacio = iniciar/pausar, R = reiniciar, F = toggle FS
  document.addEventListener("keydown", (e) => {
    const editing = document.activeElement === inDur;
    if (e.code === "Space" || e.key === " ") {
      if (!editing) { e.preventDefault(); running ? pause() : start(); }
    } else if (e.key?.toLowerCase() === "r") {
      if (!editing) { e.preventDefault(); reset(); }
    } else if (e.key?.toLowerCase() === "f") {
      if (!editing) { e.preventDefault(); toggleFS(); }
    }
  });

  // Init
  setDisplay(remaining);
  updateButtons();
  syncDurationInput();
  setProgressElapsed(0); // inicio sin rellenar
  onFSChange();

  // Limpieza si #main es reemplazado por otra página
  const cleanup = () => {
    clearTimeout(ticker);
    ticker = null;
    document.removeEventListener("fullscreenchange", onFSChange);
  };
  document.addEventListener("app:main-updated", cleanup, { once: true });
})();
</script>
