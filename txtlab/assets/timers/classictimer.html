<section id="dt-root" class="game-root timer-page" aria-labelledby="dt-title">
  <!-- Barra de control (fila única) -->
  <div class="timer-controls" role="toolbar" aria-label="Controles del temporizador">
    <h2 id="dt-title" class="sr-only">Temporizador clásico</h2>

    <label for="dt-duration" class="sr-only">Duración (h:mm:ss o mm:ss)</label>
    <input
      id="dt-duration"
      class="dt-input"
      type="text"
      inputmode="numeric"
      autocomplete="off"
      placeholder="00:05:00"
      aria-label="Duración en formato horas:minutos:segundos"
      value="00:05:00"
      pattern="^\\d{1,2}:\\d{2}(:\\d{2})?$"
      title="Usa h:mm:ss o mm:ss (por ejemplo, 00:05:00 o 05:00)"
    />

    <button id="dt-dec" class="action ghost" type="button" title="−1 minuto">
      <i class="fa-solid fa-minus" aria-hidden="true"></i><span class="lbl"></span>
    </button>
    <button id="dt-inc" class="action ghost" type="button" title="+1 minuto">
      <i class="fa-solid fa-plus" aria-hidden="true"></i><span class="lbl"></span>
    </button>

    <button id="dt-start" class="action" type="button" title="Iniciar (Espacio)">
      <i class="fa-solid fa-play" aria-hidden="true"></i><span class="lbl">Iniciar</span>
    </button>

    <button id="dt-pause" class="action" type="button" title="Pausar (Espacio)" disabled>
      <i class="fa-solid fa-pause" aria-hidden="true"></i><span class="lbl">Pausar</span>
    </button>

    <button id="dt-reset" class="action ghost" type="button" title="Reiniciar (R)">
      <i class="fa-solid fa-rotate-left" aria-hidden="true"></i><span class="lbl"></span>
    </button>

    <button id="dt-fs" class="action" type="button" title="Pantalla completa (F)">
      <i class="fa-solid fa-expand" aria-hidden="true"></i><span class="lbl"></span>
    </button>
  </div>

  <!-- Botón salir (visible en pantalla completa) -->
  <button id="dt-fs-exit" class="dt-fs-exit" type="button" title="Salir de pantalla completa (Esc)">
    <i class="fa-solid fa-xmark" aria-hidden="true"></i><span class="sr-only">Salir</span>
  </button>

  <!-- Cara del temporizador: reloj analógico -->
  <div class="timer-face" role="timer" aria-live="polite" aria-atomic="true">
    <!-- Texto accesible para lectores de pantalla -->
    <span id="dt-time" class="sr-only">00:05:00</span>

    <div class="analog-clock" aria-hidden="true">
      <svg class="clock" viewBox="0 0 100 100" width="100%" height="100%" focusable="false" aria-hidden="true">
        <!-- Aro de progreso (restante) -->
        <circle id="dt-ring-bg" cx="50" cy="50" r="46" fill="none" stroke="currentColor" opacity=".12" stroke-width="3"/>
        <circle id="dt-ring"    cx="50" cy="50" r="46" fill="none" stroke="currentColor" stroke-width="3"
                stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="0"
                transform="rotate(-90 50 50)"/>
        <!-- Esfera -->
        <circle cx="50" cy="50" r="48" fill="var(--c-bg, #fff)" stroke="var(--c-border, rgba(0,0,0,.15))" stroke-width="1"/>
        <!-- Marcas hora -->
        <g stroke="currentColor" stroke-width="2" opacity=".8">
          <line x1="50" y1="6"  x2="50" y2="12"/>
          <line x1="50" y1="88" x2="50" y2="94"/>
          <line x1="6"  y1="50" x2="12" y2="50"/>
          <line x1="88" y1="50" x2="94" y2="50"/>
          <line x1="22.68" y1="22.68" x2="27.0" y2="27.0"/>
          <line x1="72.99" y1="72.99" x2="77.32" y2="77.32"/>
          <line x1="22.68" y1="77.32" x2="27.0" y2="72.99"/>
          <line x1="72.99" y1="27.0"  x2="77.32" y2="22.68"/>
        </g>
        <!-- Marcas minuto (sutiles) -->
        <g stroke="currentColor" stroke-width="1" opacity=".35">
          <!-- 12 marcas menores entre principales -->
          <g transform="rotate(30 50 50)"><line x1="50" y1="8" x2="50" y2="12"/></g>
          <g transform="rotate(60 50 50)"><line x1="50" y1="8" x2="50" y2="12"/></g>
          <g transform="rotate(120 50 50)"><line x1="50" y1="8" x2="50" y2="12"/></g>
          <g transform="rotate(150 50 50)"><line x1="50" y1="8" x2="50" y2="12"/></g>
          <g transform="rotate(210 50 50)"><line x1="50" y1="8" x2="50" y2="12"/></g>
          <g transform="rotate(240 50 50)"><line x1="50" y1="8" x2="50" y2="12"/></g>
          <g transform="rotate(300 50 50)"><line x1="50" y1="8" x2="50" y2="12"/></g>
          <g transform="rotate(330 50 50)"><line x1="50" y1="8" x2="50" y2="12"/></g>
        </g>
        <!-- Manecillas -->
        <g id="hand-hour" stroke="currentColor" stroke-linecap="round">
          <line x1="50" y1="50" x2="50" y2="29" stroke-width="3.5"/>
        </g>
        <g id="hand-min" stroke="currentColor" stroke-linecap="round" opacity=".9">
          <line x1="50" y1="50" x2="50" y2="18" stroke-width="2.5"/>
        </g>
        <g id="hand-sec" stroke="var(--c-accent, steelblue)" stroke-linecap="round">
          <line x1="50" y1="53" x2="50" y2="12" stroke-width="1.5"/>
        </g>
        <!-- Eje central -->
        <circle cx="50" cy="50" r="2.2" fill="currentColor"/>
      </svg>
    </div>
  </div>

  <!-- Barra de progreso (restante: 100% -> 0%) -->
  <div class="timer-progress" role="progressbar" aria-label="Tiempo restante" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
    <div class="bar" style="width: 100%"></div>
  </div>

  <!-- Presets -->
  <div class="timer-presets" role="group" aria-label="Duraciones rápidas">
    <button class="action ghost preset" data-seconds="30">30 s</button>
    <button class="action ghost preset" data-seconds="60">1 min</button>
    <button class="action ghost preset" data-seconds="300">5 min</button>
    <button class="action ghost preset" data-seconds="600">10 min</button>
    <button class="action ghost preset" data-seconds="1800">30 min</button>
    <button class="action ghost preset" data-seconds="3600">1 hora</button>
  </div>
</section>

<style>
  .sr-only {
    position: absolute !important;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0);
    white-space: nowrap; border: 0;
  }

  .timer-page { width: 100%; display: block; padding: clamp(8px, 2vw, 16px); box-sizing: border-box; }

  .timer-controls {
    display: flex; align-items: center; gap: .5rem; flex-wrap: nowrap;
    margin-bottom: .75rem; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px;
  }
  .timer-controls .lbl { margin-left: .35rem; }

  .dt-input {
    width: 10ch; min-width: 12ch; text-align: center; font: inherit; font-variant-numeric: tabular-nums;
    padding: .4rem .55rem; border: 1px solid var(--c-border, #ccc); border-radius: .5rem;
    background: var(--c-surface, transparent); color: var(--c-text, #111); outline-offset: 2px;
  }
  .dt-input:invalid { outline: 2px solid color-mix(in srgb, #ff4d4f 60%, transparent); outline-offset: 2px; }

  .timer-face {
    width: 100%;
    min-height: clamp(180px, 35vw, 360px);
    display: grid; place-items: center;
    padding: clamp(12px, 3vw, 24px);
    border: 1px solid var(--c-border, rgba(0,0,0,.15));
    border-radius: 12px;
    background: var(--c-bg, transparent);
    color: var(--c-text, #111);
    box-sizing: border-box;
  }
  .timer-face.done {
    border-color: var(--c-accent, steelblue);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--c-accent, steelblue) 20%, transparent) inset;
  }

  .analog-clock { width: min(80vw, 460px); max-width: 680px; aspect-ratio: 1 / 1; }
  .clock { display: block; width: 100%; height: auto; }

  .timer-progress {
    width: 100%; height: 12px; margin-top: .6rem;
    border: 1px solid var(--c-border, rgba(0,0,0,.15)); border-radius: 999px;
    background: color-mix(in oklab, var(--c-border, rgba(0,0,0,.15)) 20%, transparent); overflow: hidden; box-sizing: border-box;
  }
  .timer-progress .bar { height: 100%; width: 100%; background: var(--c-accent, steelblue); transition: width .2s linear; }

  .timer-presets {
    display: flex; flex-wrap: nowrap; gap: .5rem; justify-content: flex-start;
    margin-top: .75rem; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-block: 2px;
  }

  .dt-fs-exit {
    position: fixed; top: calc(12px + env(safe-area-inset-top, 0px));
    right: calc(12px + env(safe-area-inset-right, 0px)); z-index: 10000;
    display: none; align-items: center; justify-content: center;
    width: 44px; height: 44px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,.25); background: rgba(0,0,0,.45); color: #fff;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); cursor: pointer;
  }

  #dt-root.is-fs .dt-fs-exit { display: inline-flex; }
  #dt-root:fullscreen  .dt-fs-exit,
  #dt-root:-webkit-full-screen .dt-fs-exit,
  #dt-root:-moz-full-screen .dt-fs-exit { display: inline-flex; }

  #dt-root.is-fs,
  #dt-root:fullscreen,
  #dt-root:-webkit-full-screen,
  #dt-root:-moz-full-screen {
    display: flex; flex-direction: column; min-height: 100vh;
    padding: clamp(8px, 2vw, 16px); box-sizing: border-box;
  }
  #dt-root.is-fs .timer-controls,
  #dt-root:fullscreen .timer-controls,
  #dt-root:-webkit-full-screen .timer-controls,
  #dt-root:-moz-full-screen .timer-controls { margin-bottom: .75rem; }
  #dt-root.is-fs .timer-face,
  #dt-root:fullscreen .timer-face,
  #dt-root:-webkit-full-screen .timer-face,
  #dt-root:-moz-full-screen .timer-face {
    flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center;
  }

  @media (max-width: 560px) { .timer-controls .lbl { display: none; } }
</style>

<script>
(function () {
  /* --------- DOM refs --------- */
  const root     = document.getElementById("dt-root");
  const elTime   = document.getElementById("dt-time");      // sr-only para accesibilidad
  const inDur    = document.getElementById("dt-duration");
  const btnInc   = document.getElementById("dt-inc");
  const btnDec   = document.getElementById("dt-dec");
  const btnStart = document.getElementById("dt-start");
  const btnPause = document.getElementById("dt-pause");
  const btnReset = document.getElementById("dt-reset");
  const btnFS    = document.getElementById("dt-fs");
  const btnFSx   = document.getElementById("dt-fs-exit");
  const face     = root.querySelector(".timer-face");
  const presets  = root.querySelector(".timer-presets");
  const progWrap = root.querySelector(".timer-progress");
  const progBar  = progWrap.querySelector(".bar");

  // Reloj analógico (SVG)
  const handH = document.getElementById("hand-hour");
  const handM = document.getElementById("hand-min");
  const handS = document.getElementById("hand-sec");
  const ring  = document.getElementById("dt-ring");

  /* --------- Estado --------- */
  let total = 5 * 60;         // 5 minutos por defecto
  let remaining = total;
  let running = false;
  let ticker = null;
  let deadline = 0;

  // Sonido
  let audioCtx = null;
  let lastBeepSec = null;
  function ensureAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  }
  function beep({ freq = 880, dur = 0.08, type = "sine", gain = 0.06 } = {}) {
    if (!audioCtx) return;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = 0;
    o.connect(g); g.connect(audioCtx.destination);
    const now = audioCtx.currentTime;
    g.gain.linearRampToValueAtTime(gain, now + 0.005);
    g.gain.linearRampToValueAtTime(0.0001, now + dur);
    o.start(now); o.stop(now + dur + 0.02);
  }
  function beepTick() { beep({ freq: 900, dur: 0.06, type: "sine", gain: 0.07 }); }
  function beepFinal() {
    if (!audioCtx) return;
    [{t:0.00,f:660,d:0.08},{t:0.09,f:880,d:0.10},{t:0.21,f:660,d:0.16}]
      .forEach(s=>setTimeout(()=>beep({freq:s.f,dur:s.d,type:"sine",gain:0.09}), s.t*1000));
  }

  /* --------- Utils --------- */
  const clamp = (n, min, max) => Math.min(max, Math.max(min, n));
  const pad2 = (n) => String(n).padStart(2, "0");
  const fmtHMS = (s) => {
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = Math.max(0, s % 60);
    return `${pad2(h)}:${pad2(m)}:${pad2(sec)}`;
  };
  const parseHMS = (str) => {
    if (!str) return null;
    const t = String(str).trim();
    let m = t.match(/^(\d{1,2}):(\d{2}):(\d{2})$/);
    if (m) {
      const h = parseInt(m[1], 10);
      const mi= parseInt(m[2], 10);
      const s  = parseInt(m[3], 10);
      if (mi > 59 || s > 59) return null;
      return h * 3600 + mi * 60 + s;
    }
    m = t.match(/^(\d{1,2}):(\d{2})$/); // mm:ss
    if (m) {
      const mi= parseInt(m[1], 10);
      const s  = parseInt(m[2], 10);
      if (mi > 59 || s > 59) return null;
      return mi * 60 + s;
    }
    return null;
  };

  // Longitud del aro de progreso (circunferencia r=46) = ~289
  const RING_LEN = 2 * Math.PI * 46; // ~288.5

  function setAnalogFromSeconds(seconds) {
    // Texto accesible
    elTime.textContent = fmtHMS(seconds);

    // Convertimos "tiempo restante" a una hora en un dial de 12h (mod 12)
    const h    = Math.floor(seconds / 3600);
    const m    = Math.floor((seconds % 3600) / 60);
    const s    = seconds % 60;

    const hr12 = h % 12;
    const hourAngle   = hr12 * 30 + m * 0.5 + s * (0.5/60); // 360/12=30
    const minuteAngle = m * 6 + s * 0.1;                    // 360/60=6
    const secondAngle = s * 6;                              // 360/60=6

    handH.setAttribute("transform", `rotate(${hourAngle} 50 50)`);
    handM.setAttribute("transform", `rotate(${minuteAngle} 50 50)`);
    handS.setAttribute("transform", `rotate(${secondAngle} 50 50)`);
  }

  function updateButtons() { btnStart.disabled = running; btnPause.disabled = !running; }
  function syncDurationInput() { inDur.value = fmtHMS(total); }

  function setProgressPercent(pct) {
    const p = clamp(Math.round(pct), 0, 100);
    progBar.style.width = p + "%";
    progWrap.setAttribute("aria-valuenow", String(p));
    // Aro de progreso en el reloj (restante):
    if (ring) {
      const offset = RING_LEN * (1 - p / 100);
      ring.setAttribute("stroke-dasharray", `${RING_LEN.toFixed(1)}`);
      ring.setAttribute("stroke-dashoffset", `${offset.toFixed(1)}`);
    }
  }
  function updateProgress() {
    const pct = total > 0 ? (remaining / total) * 100 : 0;
    setProgressPercent(pct);
  }

  /* --------- Temporización con corrección de deriva --------- */
  function tick() {
    const now = Date.now();
    const secs = Math.max(0, Math.ceil((deadline - now) / 1000));
    if (secs !== remaining) {
      remaining = secs;
      setAnalogFromSeconds(remaining);
      updateProgress();

      if (remaining <= 10 && remaining > 0 && remaining !== lastBeepSec) {
        lastBeepSec = remaining;
        beepTick();
      }
    }

    if (remaining <= 0) {
      stop(false);
      face.classList.add("done");
      setProgressPercent(0);
      beepFinal();
      return;
    }

    ticker = setTimeout(tick, 200);
  }

  function start() {
    if (running) return;
    if (remaining <= 0) remaining = total;
    running = true;
    face.classList.remove("done");
    ensureAudio();
    lastBeepSec = null;
    deadline = Date.now() + remaining * 1000;
    setAnalogFromSeconds(remaining);
    updateButtons();
    updateProgress();
    tick();
  }
  function pause() {
    if (!running) return;
    remaining = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
    running = false;
    updateButtons();
    clearTimeout(ticker); ticker = null;
    updateProgress();
  }
  function stop(userInitiated = true) {
    running = false;
    updateButtons();
    clearTimeout(ticker); ticker = null;
    if (userInitiated) { /* no beep final */ }
  }
  function reset() {
    stop(true);
    remaining = total;
    face.classList.remove("done");
    setAnalogFromSeconds(remaining);
    setProgressPercent(100);
  }

  /* --------- Cambiar duración --------- */
  function setDurationSeconds(secs, { stopIfRunning = true } = {}) {
    secs = clamp(Math.floor(secs), 1, 99 * 3600 + 59 * 60 + 59);
    total = secs;
    syncDurationInput();
    if (running && !stopIfRunning) {
      const now = Date.now();
      const rem = Math.max(0, Math.ceil((deadline - now) / 1000));
      const elapsed = clamp(total - rem, 0, total);
      remaining = clamp(total - elapsed, 0, total);
      deadline = now + remaining * 1000;
    } else {
      stop(true);
      remaining = total;
    }
    face.classList.remove("done");
    setAnalogFromSeconds(remaining);
    setProgressPercent(100);
  }
  function applyDurationFromInput() {
    const secs = parseHMS(inDur.value);
    if (secs == null || secs <= 0) return;
    setDurationSeconds(secs, { stopIfRunning: true });
  }
  function incMinute() {
    if (running) {
      total = clamp(total + 60, 1, 99*3600 + 59*60 + 59);
      syncDurationInput();
      deadline += 60 * 1000;
      const rem = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
      setAnalogFromSeconds(rem);
      updateProgress();
    } else {
      setDurationSeconds(total + 60, { stopIfRunning: true });
    }
  }
  function decMinute() {
    if (running) {
      total = clamp(total - 60, 1, 99*3600 + 59*60 + 59);
      syncDurationInput();
      deadline -= 60 * 1000;
      const rem = Math.max(1, Math.ceil((deadline - Date.now()) / 1000));
      deadline = Date.now() + rem * 1000;
      setAnalogFromSeconds(rem);
      updateProgress();
    } else {
      setDurationSeconds(Math.max(1, total - 60), { stopIfRunning: true });
    }
  }

  /* --------- Pantalla completa --------- */
  const isFS = () => document.fullscreenElement === root
                 || document.webkitFullscreenElement === root
                 || document.mozFullScreenElement === root;

  async function enterFS() {
    try {
      if (root.requestFullscreen) await root.requestFullscreen({ navigationUI: "hide" });
      else if (root.webkitRequestFullscreen) root.webkitRequestFullscreen();
      else if (root.mozRequestFullScreen) root.mozRequestFullScreen();
    } catch (e) { console.warn("[dt] No se pudo poner en pantalla completa:", e); }
  }
  async function exitFS() {
    try {
      if (document.fullscreenElement) await document.exitFullscreen();
      else if (document.webkitFullscreenElement && document.webkitExitFullscreen) document.webkitExitFullscreen();
      else if (document.mozFullScreenElement && document.mozCancelFullScreen) document.mozCancelFullScreen();
    } catch (e) { console.warn("[dt] No se pudo salir de pantalla completa:", e); }
  }
  function toggleFS() { isFS() ? exitFS() : enterFS(); }
  function onFSChange() {
    if (isFS()) {
      root.classList.add("is-fs");
      btnFS.querySelector("i")?.classList.replace("fa-expand", "fa-compress");
      btnFS.title = "Salir de pantalla completa (F)";
      const lbl = btnFS.querySelector(".lbl"); if (lbl) lbl.textContent = "Salir de pant. completa";
    } else {
      root.classList.remove("is-fs");
      btnFS.querySelector("i")?.classList.replace("fa-compress", "fa-expand");
      btnFS.title = "Pantalla completa (F)";
      const lbl = btnFS.querySelector(".lbl"); if (lbl) lbl.textContent = "";
    }
  }

  /* --------- Eventos --------- */
  btnStart.addEventListener("click", start);
  btnPause.addEventListener("click", pause);
  btnReset.addEventListener("click", reset);
  btnFS.addEventListener("click", toggleFS);
  btnFSx.addEventListener("click", exitFS);
  document.addEventListener("fullscreenchange", onFSChange);

  inDur.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); applyDurationFromInput(); }
    else if (e.key.toLowerCase() === "r") { e.preventDefault(); reset(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); incMinute(); }
    else if (e.key === "ArrowDown") { e.preventDefault(); decMinute(); }
  });
  inDur.addEventListener("blur", applyDurationFromInput);

  btnInc.addEventListener("click", incMinute);
  btnDec.addEventListener("click", decMinute);

  presets.addEventListener("click", (e) => {
    const btn = e.target.closest("button.preset[data-seconds]");
    if (!btn) return;
    const secs = parseInt(btn.getAttribute("data-seconds"), 10);
    if (Number.isFinite(secs)) {
      setDurationSeconds(secs, { stopIfRunning: true });
      // start(); // si quieres auto-arranque tras preset
    }
  });

  // Atajos globales
  document.addEventListener("keydown", (e) => {
    const editing = document.activeElement === inDur;
    if (e.code === "Space" || e.key === " ") {
      if (!editing) { e.preventDefault(); running ? pause() : start(); }
    } else if (e.key?.toLowerCase() === "r") {
      if (!editing) { e.preventDefault(); reset(); }
    } else if (e.key?.toLowerCase() === "f") {
      if (!editing) { e.preventDefault(); toggleFS(); }
    }
  });

  // Init
  setAnalogFromSeconds(remaining);
  updateButtons();
  syncDurationInput();
  setProgressPercent(100);
  onFSChange();

  // Limpieza si #main se reemplaza
  const cleanup = () => {
    clearTimeout(ticker); ticker = null;
    document.removeEventListener("fullscreenchange", onFSChange);
  };
  document.addEventListener("app:main-updated", cleanup, { once: true });
})();
</script>
