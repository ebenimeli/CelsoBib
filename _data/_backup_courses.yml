  location: UNED
  start: febrero 2026
  end: junio 2026
  language: ES
  contents: "Introduccion al tratamiento computacional del léxico · El almacenamiento computacional del léxico · Revisión sobre los córpora · La codificación del significado en diccionarios y tesaurus · Bases de datos · Diccionarios · Ontologías"
  url: https://www.uned.es/universidad/inicio/estudios/masteres/master-universitario-en-las-tecnologias-de-la-informacion-y-la-comunicacion-en-la-ensenanza-y-el-tratamiento-de-lenguas/asignaturas.html?codAsignatura=24409193&codTitulacion=240901&idContenido=1
