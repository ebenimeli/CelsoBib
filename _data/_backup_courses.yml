- name: "Elaboración y Digitalización de Materiales CLIL"
  program: "Máster Universitario en las Tecnologías de la Información y la Comunicación en la Enseñanza y el Tratamiento de Lenguas"
  organizer: Facultad de Filología. Universidad Nacional de Educación a Distancia
  credits: 5
  hours: 125
  description: "La asignatura aborda el aprendizaje integrado de lengua y contenidos (CLIL) en el marco del plurilingüismo europeo. Forma al estudiante en la creación y digitalización de materiales didácticos mediante tecnologías educativas. Proporciona competencias prácticas para elaborar recursos centrados en el contenido, favoreciendo metodologías innovadoras en la enseñanza de lenguas con apoyo tecnológico."
