- name: "Ontologías, Diccionarios y Lexicones Restringidos Computacionales"
  program: "Máster Universitario en las Tecnologías de la Información y la Comunicación en la Enseñanza y el Tratamiento de Lenguas"
  organizer: Facultad de Filología. Universidad Nacional de Educación a Distancia
  credits: 5
  hours: 125
  description: "La asignatura ofrece una introducción al tratamiento computacional del léxico mediante ontologías, diccionarios y lexicones restringidos. Aborda análisis de corpus, codificación conceptual y textual, extracción de léxico y uso de software especializado. Facilita la comprensión de frecuencias, co-ocurrencias y análisis estadístico, proporcionando al alumnado una visión general de recursos léxicos y ontológicos digitales."
