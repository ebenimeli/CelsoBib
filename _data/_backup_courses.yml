- name: "El Análisis de la Lengua Mediante Corpus"
  program: "Máster Universitario en las Tecnologías de la Información y la Comunicación en la Enseñanza y el Tratamiento de Lenguas"
  organizer: Facultad de Filología. Universidad Nacional de Educación a Distancia
  credits: 5
  hours: 125
  description: "La asignatura introduce al estudiante en la lingüística del corpus, un enfoque de investigación basado en datos. Enseña recopilación y procesamiento computacional de muestras lingüísticas, análisis cuantitativo y cualitativo, y aplicación en ámbitos profesionales. Desarrolla competencias en el uso de herramientas, fomenta pensamiento crítico, curiosidad intelectual y capacidad para diseñar modelos de análisis fiables."
  modality: Online
  location: UNED
  start: octubre 2025
  end: febrero 2026
  language: ES
  contents: "Fundamentos y valor de los datos cuantitativos frente a la intuición personal · Las recopilaciones de datos lingüísticos y su definición · Los corpus lingüísticos: requisitos formales y científicos. Variantes de los corpus y su especificidad en distintos ámbitos de investigación y de trabajo profesional · La palabra electrónica y su tratamiento · Aplicaciones de las recopilaciones de datos lingüísticos en distintas áreas del lenguaje · Herramientas informáticas para el tratamiento de corpus · El uso de corpus en distintos ámbitos de la investigación lingüística · Aplicaciones informáticas de los corpus en ámbitos profesionales (enseñanza, traducción, ciencias jurídicas y sociales) · Herramientas estadísticas en el análisis mediante corpus."
  url: https://www.uned.es/universidad/inicio/estudios/masteres/master-universitario-en-las-tecnologias-de-la-informacion-y-la-comunicacion-en-la-ensenanza-y-el-tratamiento-de-lenguas/asignaturas.html?codAsignatura=24409047&codTitulacion=240901&idContenido=1
  visibility: public

