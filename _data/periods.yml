- title: "3000–2901 a. C."
  description: "Entre 3000 y 2901 a. C., la revolución urbana ya era un hecho en varios puntos del planeta. En Mesopotamia, ciudades-estado como Uruk y Ur consolidaron instituciones, escritura cuneiforme y administración templaria. En Egipto, la unificación del Alto y Bajo Egipto dio inicio al periodo dinástico, con reyes que organizaron el Estado, la fiscalidad y grandes obras. El comercio conectó el Nilo con el Levante y el mar Rojo. La metalurgia del cobre se extendió, y la vida cotidiana se estructuró alrededor de agricultura irrigada, jerarquías sociales y cultos locales en rápido crecimiento."
  period_start: -3000
  period_end: -2901

- title: "2900–2801 a. C."
  description: "Durante 2900–2801 a. C., Mesopotamia vivió una intensa competencia entre ciudades-estado sumerias, reflejada en listas reales, guerras por canales y prestigio religioso. En Egipto, las primeras dinastías afianzaron la administración central, los rituales funerarios y el simbolismo del faraón como garante del orden. En el valle del Indo se perfilaron asentamientos que más tarde formarían una gran civilización. Avanzaron técnicas agrícolas y artesanales: cerámica estandarizada, sellos, tejidos y navegación fluvial. La escritura y la contabilidad reforzaron el poder político, mientras las redes de intercambio difundían materias primas y estilos artísticos."
  period_start: -2900
  period_end: -2801

- title: "2800–2701 a. C."
  description: "Entre 2800 y 2701 a. C., la cultura sumeria produjo textos tempranos, himnos y mitos que anticipan grandes tradiciones literarias. El control del agua siguió siendo clave para la riqueza y el conflicto. En Egipto, los complejos funerarios evolucionaron hacia formas monumentales, preparando el camino para las pirámides. En Europa, comunidades neolíticas avanzadas levantaron megalitos y expandieron la agricultura. En el Indo crecieron asentamientos planificados con artesanía especializada. El cobre y los primeros bronces impulsaron herramientas y armas. La religión, estrechamente ligada al Estado, justificó jerarquías y legitimó proyectos colectivos de gran escala."
  period_start: -2800
  period_end: -2701

- title: "2700–2601 a. C."
  description: "El periodo 2700–2601 a. C. marcó el auge del Imperio Antiguo egipcio, con una burocracia capaz de movilizar recursos y trabajo para grandes construcciones. En Mesopotamia surgieron reyes guerreros y alianzas cambiantes; la ciudad de Kish adquirió relevancia, mientras otras competían por hegemonía. En el Indo, el crecimiento urbano fue acompañado por redes comerciales hacia Irán y Asia Central. En el Mediterráneo oriental, la navegación conectó islas y costas mediante intercambio de metales, madera y cerámica. La vida social se hizo más compleja: especialización laboral, clases dirigentes, artesanos y campesinos integrados en sistemas tributarios."
  period_start: -2700
  period_end: -2601

- title: "2600–2501 a. C."
  description: "Entre 2600 y 2501 a. C., Egipto vivió su fase más emblemática: las pirámides de Giza y la consolidación de un Estado centralizado, con ideología real y administración eficiente. En Mesopotamia, ciudades como Lagash y Umma protagonizaron conflictos por tierras irrigadas, y se registraron leyes y contratos con mayor detalle. La civilización del Indo avanzó hacia su apogeo urbano, con planificación y comercio a larga distancia. En Europa occidental, los megalitos siguieron en uso, mientras se difundían técnicas agrícolas y nuevas formas de jerarquía local. El bronce comenzó a generalizarse, acelerando cambios tecnológicos."
  period_start: -2600
  period_end: -2501

- title: "2500–2401 a. C."
  description: "Durante 2500–2401 a. C., el Imperio Antiguo egipcio mantuvo su estabilidad, aunque se perciben tensiones regionales y un crecimiento del poder de los nomarcas. En Mesopotamia, el impulso militar y diplomático produjo reinos más ambiciosos; destacan relatos épicos vinculados a Uruk y figuras como Gilgamesh en tradición literaria posterior. En el Indo, ciudades con barrios especializados reflejaron una sociedad organizada y próspera. El comercio conectó el Golfo Pérsico, Anatolia y el Levante, transportando cobre, estaño y piedras semipreciosas. La religión y la administración sostuvieron el orden, mientras los conflictos por recursos persistían."
  period_start: -2500
  period_end: -2401

- title: "2400–2301 a. C."
  description: "Entre 2400 y 2301 a. C., Mesopotamia presenció la aparición de líderes que buscaban unificar territorios: se intensificaron conquistas, tributos y propaganda real. En Egipto, la continuidad dinástica convivió con una mayor autonomía local, y los complejos funerarios evolucionaron en forma y ritual. La civilización del Indo alcanzó un nivel alto de urbanismo, estandarización y comercio. En otras regiones, la metalurgia del bronce y la rueda impulsaron transporte y producción. Las redes de intercambio cultural crecieron: sellos, estilos artísticos y tecnologías circularon entre zonas distantes, reforzando la interconexión del mundo antiguo."
  period_start: -2400
  period_end: -2301

- title: "2300–2201 a. C."
  description: "El periodo 2300–2201 a. C. estuvo marcado por el Imperio acadio en Mesopotamia, uno de los primeros estados territoriales amplios, con administración y ejército profesional. La lengua acadia ganó prestigio y se expandió en documentos. En Egipto, el final del Imperio Antiguo se aproximaba, con cambios internos y presiones económicas. En el Indo continuó la prosperidad urbana. Se registran señales de inestabilidad climática en algunas zonas, que afectaron cosechas y movimientos poblacionales. Aun así, la producción artesanal, el comercio y la burocracia siguieron creciendo. La idea de “imperio” como proyecto político comenzó a consolidarse."
  period_start: -2300
  period_end: -2201

- title: "2200–2101 a. C."
  description: "Entre 2200 y 2101 a. C., varias regiones experimentaron crisis y reorganizaciones. En Mesopotamia, el declive acadio dio paso a fragmentación y a nuevos poderes locales; la reconstrucción posterior incluyó reformas administrativas. En Egipto, el colapso del Imperio Antiguo condujo al Primer Periodo Intermedio, con rivalidades entre centros regionales y cambios en el control del territorio. En el Indo se observan transformaciones que, con el tiempo, afectarían su estructura urbana. Factores ambientales y presiones sociales pudieron contribuir a estos cambios. A pesar de la inestabilidad, la escritura, la religión y las tradiciones estatales sobrevivieron y se adaptaron."
  period_start: -2200
  period_end: -2101

- title: "2100–2001 a. C."
  description: "Durante 2100–2001 a. C., Mesopotamia vivió un renacimiento con la Tercera Dinastía de Ur, que impulsó una administración altamente burocrática, códigos legales y grandes proyectos de irrigación. El control del trabajo y los impuestos se documentó con detalle en tablillas. En Egipto, los reinos regionales compitieron hasta avanzar hacia la reunificación. En el Mediterráneo y Anatolia, redes comerciales siguieron moviendo metales, madera y textiles. En el Indo, las ciudades aún mostraban complejidad, aunque empezaban cambios graduales. Este siglo reforzó la idea de Estado planificador, capaz de organizar economía y sociedad mediante escritura y contabilidad."
  period_start: -2100
  period_end: -2001

- title: "2000–1901 a. C."
  description: "Entre 2000 y 1901 a. C., el mundo antiguo se reconfiguró. En Mesopotamia, tras el declive de Ur III surgieron reinos amorreos, y Babilonia comenzó su ascenso. El comercio con Anatolia se intensificó mediante colonias mercantiles. En Egipto, se consolidó el Imperio Medio, con reunificación, expansión hacia Nubia y un florecimiento cultural notable. En el Egeo aparecieron palacios tempranos y comunidades marítimas activas. En el Indo, cambios en patrones de asentamiento anunciaron transformaciones posteriores. El bronce se generalizó, y con él crecieron ejércitos, diplomacia y rivalidades entre estados."
  period_start: -2000
  period_end: -1901

- title: "1900–1801 a. C."
  description: "Durante 1900–1801 a. C., Babilonia y otros reinos mesopotámicos compitieron por hegemonía, mientras los archivos comerciales muestran una economía dinámica conectada con Anatolia y el Levante. Egipto, en el Imperio Medio, desarrolló literatura, arte y administración refinada, además de proyectos hidráulicos y defensivos. En el Egeo, Creta avanzó hacia la civilización minoica con palacios y redes marítimas. En el Indo continuaron cambios regionales. La diplomacia y los tratados empezaron a ser cruciales, y la movilidad de pueblos y mercaderes incrementó el contacto cultural. Las religiones estatales y los ritos funerarios se diversificaron."
  period_start: -1900
  period_end: -1801

- title: "1800–1701 a. C."
  description: "Entre 1800 y 1701 a. C., el Próximo Oriente vivió un mosaico de reinos: Babilonia se fortaleció, y en Anatolia prosperaron centros urbanos conectados por comercio de metales. En Egipto, el Imperio Medio continuó, pero se acercaban tensiones que desembocarían en la llegada de los hicsos. En el Egeo, Creta y el mundo minoico florecieron, con escritura y arquitectura palacial. En el Levante, ciudades-estado mantuvieron rutas y alianzas. La tecnología del bronce y el carro de guerra empezó a ganar importancia. Este siglo fue clave para la formación de redes internacionales que dominarían la Edad del Bronce tardía."
  period_start: -1800
  period_end: -1701

- title: "1700–1601 a. C."
  description: "El periodo 1700–1601 a. C. estuvo marcado por cambios políticos decisivos. Egipto entró en el Segundo Periodo Intermedio, con dominio hicso en el delta y reinos egipcios en el sur que prepararon la reunificación. En Mesopotamia, Babilonia y otros poderes competían, mientras en Anatolia se consolidaba el Imperio hitita. En el Egeo, la civilización minoica sufrió crisis y transformaciones, y el mundo micénico comenzó a ganar protagonismo. La guerra con carros se expandió y las fortificaciones aumentaron. Las rutas comerciales siguieron uniendo el Mediterráneo oriental con Asia, moviendo estaño, cobre y bienes de lujo."
  period_start: -1700
  period_end: -1601

- title: "1600–1501 a. C."
  description: "Entre 1600 y 1501 a. C., Egipto se reunificó y dio inicio al Imperio Nuevo, expandiéndose hacia Nubia y el Levante con un ejército profesional. En Anatolia, los hititas crecieron como potencia, mientras el Levante seguía siendo un corredor estratégico. En el Egeo, los micénicos se consolidaron como sociedad guerrera y palacial. Mesopotamia vivió rivalidades entre reinos y alianzas cambiantes. La diplomacia internacional del Bronce tardío empezaba a perfilarse, con intercambios de regalos y matrimonios políticos. La producción artesanal y el comercio de lujo (metales, marfil, vidrio) florecieron, impulsando una economía interconectada."
  period_start: -1600
  period_end: -1501

- title: "1500–1401 a. C."
  description: "Durante 1500–1401 a. C., el Imperio Nuevo egipcio alcanzó gran poder, con campañas en Siria-Palestina y una administración imperial eficaz. Los hititas se afirmaron en Anatolia, y el reino de Mitanni actuó como rival y socio diplomático. El Egeo micénico prosperó con palacios, escritura lineal B y comercio marítimo. Mesopotamia mantenía centros urbanos influyentes. Este siglo consolidó un “sistema internacional” en el Mediterráneo oriental basado en tratados, embajadas y comercio de lujo. La religión estatal, los templos y la ideología real sostuvieron la expansión. La artesanía refinada y la circulación de conocimientos técnicos unieron culturas distantes."
  period_start: -1500
  period_end: -1401

- title: "1400–1301 a. C."
  description: "Entre 1400 y 1301 a. C., el Mediterráneo oriental vivió su apogeo en la Edad del Bronce tardía. Egipto, bajo faraones poderosos, combinó expansión con diplomacia; el episodio de Amarna mostró tensiones religiosas y políticas. Los hititas ampliaron su influencia y chocaron con Egipto por Siria. El mundo micénico creció en riqueza y complejidad. En Mesopotamia, Asiria y Babilonia se reforzaron. El comercio internacional conectó puertos, transportando metales, textiles, cerámica y bienes suntuarios. Este siglo destaca por su intensa correspondencia diplomática y por la circulación de ideas y técnicas, aunque también por signos de fragilidad sistémica."
  period_start: -1400
  period_end: -1301

- title: "1300–1201 a. C."
  description: "El periodo 1300–1201 a. C. estuvo marcado por rivalidades imperiales y por el comienzo de inestabilidades que culminarían en el colapso del Bronce. Hititas y egipcios compitieron por el control del Levante, mientras Asiria emergía con ambición territorial. En el Egeo, los palacios micénicos mantenían redes comerciales y militares. La diplomacia continuó, pero crecieron presiones: movimientos de población, conflictos internos y tensiones económicas. Hacia finales del siglo, ataques y migraciones asociados a los llamados “Pueblos del Mar” afectaron ciudades costeras y rutas. La compleja red internacional mostró vulnerabilidades que cambiarían el mapa político del Mediterráneo."
  period_start: -1300
  period_end: -1201

- title: "1200–1101 a. C."
  description: "Entre 1200 y 1101 a. C., el Mediterráneo oriental vivió el colapso de la Edad del Bronce: desapareció el Imperio hitita, muchas ciudades del Levante fueron destruidas y los palacios micénicos se derrumbaron. Egipto resistió, aunque debilitado y con pérdidas de influencia. Las rutas comerciales se fragmentaron, y el sistema diplomático internacional se desintegró. En este nuevo escenario surgieron comunidades más pequeñas, reinos locales y nuevas identidades, como los filisteos en la costa levantina. La escritura se redujo en varias regiones y algunas sociedades entraron en fases de menor complejidad estatal. A la vez, el hierro comenzó a difundirse más ampliamente, transformando tecnología y guerra."
  period_start: -1200
  period_end: -1101

- title: "1100–1001 a. C."
  description: "Durante 1100–1001 a. C., el mundo mediterráneo se reorganizó tras el colapso del Bronce. En el Levante, los fenicios expandieron su comercio marítimo y perfeccionaron alfabetos que influirían enormemente. En Grecia continuó la Edad Oscura, con comunidades descentralizadas, aunque se mantuvieron tradiciones épicas y contactos marítimos. En la Península Ibérica y Europa atlántica avanzaron culturas del Bronce final, con intercambios de metales y objetos de prestigio. En Egipto y Mesopotamia persistieron estados, pero con menor alcance internacional. El hierro se hizo más común, y nuevas formas de organización política emergieron gradualmente, sentando bases para la época clásica."
  period_start: -1100
  period_end: -1001

- title: "1000–901 a. C."
  description: "En el siglo X a. C., Asiria comenzó a reafirmar su poder y Fenicia expandió su comercio marítimo. En el Levante se consolidaron reinos hebreos, y en Grecia persistieron formas sociales de la Edad Oscura mientras crecían contactos y relatos épicos. En China, los Zhou reforzaron su legitimidad y estructuras feudales. La difusión del hierro aceleró cambios en agricultura y guerra, y el Mediterráneo se volvió un espacio cada vez más conectado por rutas y colonias."
  period_start: -1000
  period_end: -901

- title: "900–801 a. C."
  description: "En el siglo IX a. C., Asiria se convirtió en potencia militar dominante. Fenicios fundaron colonias, ampliando redes comerciales. En Grecia comenzaron a formarse polis y aumentaron intercambios. En India se consolidaron tradiciones védicas, y en China los Zhou sostuvieron un orden feudal con tensiones regionales. La tecnología del hierro se extendió y las sociedades ganaron complejidad: nuevas élites, ejércitos más eficaces y una mayor interconexión entre regiones."
  period_start: -900
  period_end: -801

- title: "800–701 a. C."
  description: "En el siglo VIII a. C., Grecia vivió expansión colonial y se fijaron por escrito tradiciones épicas. Roma se consolidó como monarquía local en Italia. Asiria alcanzó su apogeo imperial. En China se debilitó el poder Zhou y crecieron rivalidades. En Mesoamérica destacaron los olmecas. El hierro transformó armas y herramientas, y el Mediterráneo intensificó su comercio, favoreciendo circulación de técnicas, productos y mitos."
  period_start: -800
  period_end: -701

- title: "700–601 a. C."
  description: "En el siglo VII a. C., Asiria mantuvo hegemonía pero afrontó tensiones; Babilonia resurgió. En Grecia se afianzaron polis y leyes escritas. Roma avanzó en urbanismo y organización. En India surgieron estados territoriales y en China aumentó la autonomía regional. El hierro, la monetización temprana y la expansión del comercio favorecieron cambios sociales. Este siglo fue clave para el desarrollo de estructuras políticas, religiosas y culturales que influirían en el mundo clásico."
  period_start: -700
  period_end: -601

- title: "600–501 a. C."
  description: "En el siglo VI a. C., el Imperio persa aqueménida unificó vastos territorios con administración y caminos. En Grecia se produjeron reformas que abrieron paso a nuevas formas de ciudadanía. Roma pasó a la República. En India surgieron jainismo y budismo, y en China Confucio influyó en ética y gobierno. Fue un siglo de profundas transformaciones políticas y espirituales, con nuevas ideas sobre ley, moral y legitimidad del poder."
  period_start: -600
  period_end: -501

- title: "500–401 a. C."
  description: "En el siglo V a. C., las Guerras Médicas enfrentaron a griegos y persas. Atenas vivió su Edad de Oro cultural y política, con democracia y florecimiento artístico. Roma continuó expandiéndose en Italia. En China aumentaron conflictos entre estados y se desarrollaron escuelas de pensamiento. En India el budismo creció. Este siglo consolidó modelos políticos e intelectuales influyentes y reforzó redes de intercambio entre el Mediterráneo, Oriente Próximo y Asia."
  period_start: -500
  period_end: -401

- title: "400–301 a. C."
  description: "En el siglo IV a. C., las polis griegas declinaron y Macedonia se impuso. Alejandro Magno creó un imperio que difundió el helenismo por Egipto y Asia. Roma consolidó su poder en Italia. En China se intensificó la rivalidad entre estados con reformas militares y administrativas. La cultura helenística impulsó ciencia, urbanismo y comercio, favoreciendo la mezcla de tradiciones y el paso a grandes monarquías."
  period_start: -400
  period_end: -301

- title: "300–201 a. C."
  description: "En el siglo III a. C., el mundo helenístico dominó el Mediterráneo oriental y Roma inició su expansión con las Guerras Púnicas. En China, los Qin unificaron el territorio y estandarizaron escritura y leyes. En India, el Imperio Maurya consolidó administración y difusión cultural. Fue un siglo de estados centralizados, grandes obras e integración regional, con redes comerciales que conectaron más firmemente Eurasia."
  period_start: -300
  period_end: -201

- title: "200–101 a. C."
  description: "En el siglo II a. C., Roma derrotó a Cartago y se convirtió en la potencia principal del Mediterráneo. En China, los Han consolidaron estabilidad, burocracia y expansión. El comercio a larga distancia aumentó, conectando Asia y Europa por rutas terrestres y marítimas. Se desarrollaron infraestructuras y sistemas legales duraderos. Este siglo afianzó el modelo imperial y la integración económica de amplias regiones."
  period_start: -200
  period_end: -101

- title: "100–1 a. C."
  description: "En el siglo I a. C., Roma sufrió crisis políticas y guerras civiles que llevaron al fin de la República. Julio César y Augusto abrieron el camino al Imperio. El Mediterráneo quedó cada vez más integrado bajo dominio romano. En China, los Han siguieron en apogeo y la Ruta de la Seda ganó importancia. Fue un siglo de cambios institucionales, expansión territorial y transformación social, que redefinió el poder en el mundo antiguo."
  period_start: -100
  period_end: -1

- title: "0–99"
  description: "En el siglo I d. C., el Imperio romano consolidó su administración y urbanismo. Surgió el cristianismo en el Mediterráneo oriental y comenzó su expansión. En China, los Han mantuvieron estabilidad con tensiones internas. El comercio intercontinental se intensificó por la Ruta de la Seda y el Índico. Fue un siglo de integración cultural y económica, con estructuras políticas y religiosas que influirían profundamente en siglos posteriores."
  period_start: 0
  period_end: 99

- title: "100–199"
  description: "En el siglo II d. C., Roma alcanzó máxima extensión y vivió prosperidad bajo la Pax Romana. El derecho y las ciudades se fortalecieron. En Asia, rutas comerciales sostuvieron intercambios, mientras en China crecían tensiones que desembocarían en fragmentación. En varias regiones se afianzaron redes urbanas, economías monetarias y circulación de ideas. Este siglo representó el punto culminante de la estabilidad imperial romana antes de crisis posteriores."
  period_start: 100
  period_end: 199

- title: "200–299"
  description: "En el siglo III d. C., Roma atravesó una profunda crisis: inestabilidad política, presiones fronterizas e inflación. Surgieron emperadores militares y reformas defensivas. En Persia se consolidó el Imperio sasánida como rival. En China, el fin de los Han abrió una etapa de división. Migraciones y conflictos reconfiguraron Eurasia. Fue un siglo de transición hacia la Antigüedad tardía, con cambios en economía, ejército y organización social."
  period_start: 200
  period_end: 299

- title: "300–399"
  description: "En el siglo IV d. C., el Imperio romano se reorganizó con reformas administrativas y militares, y el cristianismo ganó peso político. Constantinopla se convirtió en capital imperial, y aumentó la separación entre Oriente y Occidente. En Eurasia se intensificaron movimientos de pueblos germánicos. En China persistió fragmentación política. Este siglo definió la Antigüedad tardía: nuevas identidades religiosas, debates doctrinales y transformaciones institucionales cambiaron el mundo mediterráneo."
  period_start: 300
  period_end: 399

- title: "400–499"
  description: "En el siglo V d. C., el Imperio romano de Occidente se desintegró y surgieron reinos germánicos. El Imperio de Oriente sobrevivió y se reorganizó. La Iglesia ganó autoridad como institución estable, mientras las ciudades occidentales cambiaban su papel económico y político. En Persia continuó un poder rival. Fue un siglo de transición hacia el mundo medieval, con mezcla cultural, nuevas élites y cambios en estructuras sociales heredadas de Roma."
  period_start: 400
  period_end: 499

- title: "500–599"
  description: "En el siglo VI d. C., Bizancio, bajo Justiniano, intentó restaurar el control mediterráneo y codificó el derecho romano. En Europa occidental se consolidaron reinos posromanos y se expandió la cristianización. En Persia se mantuvo la rivalidad con Bizancio. En Asia oriental, China avanzó hacia la reunificación y nuevas dinastías. Este siglo combinó continuidad romana con transformaciones medievales tempranas, reforzando instituciones religiosas y estatales en distintos territorios."
  period_start: 500
  period_end: 599

- title: "600–699"
  description: "En el siglo VII d. C., surgió el islam y se expandió rápidamente por Oriente Próximo y el norte de África, transformando el Mediterráneo. Bizancio resistió, aunque perdió territorios. En Europa occidental continuaron reinos altomedievales. En China, la dinastía Tang impulsó crecimiento urbano y comercio. Este siglo reconfiguró el mapa geopolítico y religioso, fortaleciendo nuevas redes culturales y mercantiles entre Asia, África y Europa."
  period_start: 600
  period_end: 699

- title: "700–799"
  description: "En el siglo VIII d. C., el mundo islámico se consolidó y desarrolló centros urbanos y culturales. En Europa, el poder carolingio reorganizó territorios y administración. China Tang alcanzó un esplendor artístico y comercial. Las rutas afroeurasiáticas intensificaron intercambios de bienes e ideas. Este siglo sentó bases para la Plena Edad Media, con instituciones políticas más fuertes, expansión cultural y un crecimiento gradual de ciudades y comercio."
  period_start: 700
  period_end: 799

- title: "800–899"
  description: "En el siglo IX d. C., Carlomagno fue coronado emperador y se reforzó la idea imperial en Occidente. Vikingos intensificaron incursiones, comercio y asentamientos, conectando regiones del Atlántico y Europa del Norte. En el mundo islámico florecieron saberes, ciencia y vida urbana. En Asia, se produjeron cambios dinásticos y tensiones internas. Este siglo combinó expansión cultural, conflictos y nuevas redes de intercambio que definieron el ritmo de la Edad Media temprana."
  period_start: 800
  period_end: 899

- title: "900–999"
  description: "En el siglo X d. C., el feudalismo se afianzó en Europa y crecieron castillos y señoríos. El mundo islámico mantuvo alto nivel cultural aunque fragmentado. En Asia oriental se desarrollaron tecnologías y economías regionales. Las ciudades europeas comenzaron a recuperar dinamismo y el comercio volvió a crecer. Este siglo reforzó estructuras sociales medievales y preparó el aumento demográfico y económico de los siglos siguientes, junto con una mayor circulación de mercancías y saberes."
  period_start: 900
  period_end: 999

- title: "1000–1099"
  description: "En el siglo XI d. C., Europa vivió crecimiento demográfico, expansión agrícola y renacimiento urbano. Comenzaron las Cruzadas, intensificando contactos y conflictos con el mundo islámico. En Asia, grandes estados mantuvieron redes comerciales del Índico y la Ruta de la Seda. En China Song se aceleraron innovaciones técnicas y administrativas. Este siglo aumentó la movilidad de personas e ideas, consolidando el papel de ciudades y mercados, y sentando bases para la Plena Edad Media."
  period_start: 1000
  period_end: 1099

- title: "1100–1199"
  description: "En el siglo XII d. C., Europa experimentó expansión cultural: universidades, escolástica y auge del arte románico y gótico. Las ciudades crecieron y el comercio se intensificó. Continuaron Cruzadas y relaciones con el mundo islámico, donde se desarrollaron ciencia y filosofía. En Asia, China Song mantuvo prosperidad y avances técnicos. Este siglo consolidó instituciones educativas y urbanas, reforzó redes mercantiles y preparó grandes transformaciones políticas y económicas del final de la Edad Media."
  period_start: 1100
  period_end: 1199

- title: "1200–1299"
  description: "En el siglo XIII d. C., el Imperio mongol transformó Eurasia, unificando rutas y facilitando intercambios entre Oriente y Occidente. Europa creció comercialmente y se fortalecieron potencias urbanas. China pasó a dominio Yuan, con gran capacidad administrativa. En el mundo islámico se afrontaron crisis y reconfiguraciones. Este siglo amplió la circulación de bienes, técnicas y conocimientos, favoreció viajes y diplomacia a larga distancia y reforzó una globalización premoderna, aunque también provocó guerras y destrucciones."
  period_start: 1200
  period_end: 1299

- title: "1300–1399"
  description: "En el siglo XIV d. C., la Peste Negra redujo drásticamente la población y alteró economías y jerarquías sociales. Europa vivió conflictos y tensiones políticas, pero también cambios: mayor movilidad laboral, transformaciones agrarias y nuevas dinámicas urbanas. En Asia, el mundo mongol se fragmentó y surgieron nuevos poderes. En África occidental prosperaron reinos vinculados al comercio del oro. Fue un siglo de crisis y adaptación que preparó el Renacimiento y la transición hacia la Edad Moderna."
  period_start: 1300
  period_end: 1399

- title: "1400–1499"
  description: "En el siglo XV d. C., el Renacimiento impulsó humanismo, arte y nuevas técnicas, mientras la imprenta transformó la difusión del conocimiento. Portugal y Castilla iniciaron exploraciones oceánicas que abrieron rutas atlánticas. El Imperio otomano creció y tomó Constantinopla, reconfigurando el equilibrio mediterráneo. En otros lugares continuaron grandes estados y redes comerciales. Este siglo marcó una transición decisiva: cambios culturales, científicos y geopolíticos abrieron el camino a la expansión europea y a un mundo cada vez más interconectado."
  period_start: 1400
  period_end: 1499

- title: "1500–1599"
  description: "En el siglo XVI d. C., la expansión europea conectó definitivamente continentes mediante comercio, colonización y migraciones. Se intensificó el intercambio de productos y culturas, así como la explotación y la esclavitud atlántica. La Reforma protestante transformó religión y política, generando conflictos en Europa. El Imperio otomano alcanzó gran poder, y en Asia prosperaron grandes imperios como el mogol. Fue un siglo de globalización temprana, reorganización económica y profundas transformaciones en la visión del mundo."
  period_start: 1500
  period_end: 1599

- title: "1600–1699"
  description: "En el siglo XVII d. C., la revolución científica avanzó con nuevos métodos y descubrimientos, mientras se consolidaban estados modernos con burocracias y ejércitos. Europa vivió guerras como la de los Treinta Años. El comercio global creció mediante compañías marítimas y rutas coloniales. En Asia, dinastías como Qing en China y Tokugawa en Japón estabilizaron territorios. Aumentaron las economías atlánticas y la esclavitud de plantación. Fue un siglo de conflicto y modernización institucional, con expansión económica intercontinental."
  period_start: 1600
  period_end: 1699

- title: "1700–1799"
  description: "En el siglo XVIII d. C., la Ilustración promovió razón, ciencia y reformas, y crecieron debates sobre derechos y ciudadanía. Revoluciones atlánticas cambiaron el orden: independencia de Estados Unidos y Revolución francesa. La Revolución Industrial comenzó, transformando producción y trabajo. Los imperios coloniales se expandieron y se intensificó el comercio global. Este siglo sentó bases del mundo contemporáneo: nacionalismo, economía industrial, política moderna y nuevas tensiones sociales, junto con avances científicos y culturales."
  period_start: 1700
  period_end: 1799

- title: "1800–1899"
  description: "En el siglo XIX d. C., la Revolución Industrial se expandió, alterando economía, ciudades y condiciones laborales. Surgieron nacionalismos, unificaciones y conflictos, mientras potencias europeas ampliaron colonización en África y Asia. Avances científicos y técnicos aceleraron transportes, comunicaciones y medicina. Crecieron movimientos obreros y nuevas ideas políticas, desde liberalismo hasta socialismo. Fue un siglo de innovaciones y desigualdades, que preparó el escenario para tensiones globales del siglo XX y para una aceleración sin precedentes de la modernidad."
  period_start: 1800
  period_end: 1899

- title: "1900–1999"
  description: "En el siglo XX d. C., dos guerras mundiales y la Guerra Fría redefinieron la política global. La descolonización transformó África y Asia, creando nuevos estados. Se aceleraron avances científicos y tecnológicos: aviación, medicina, energía, informática e Internet al final del siglo. Hubo expansión de derechos civiles y cambios sociales profundos, junto con episodios de violencia masiva. Fue un siglo de extremos, con globalización económica y cultural creciente y un impacto duradero en el mundo contemporáneo."
  period_start: 1900
  period_end: 1999

- title: "2000–2099"
  description: "En el siglo XXI d. C., la globalización y la revolución digital transformaron comunicación, economía y cultura. Internet, móviles y la inteligencia artificial redefinieron trabajo y educación. El cambio climático se convirtió en desafío central, impulsando transición energética y debates políticos. Se intensificaron tensiones geopolíticas, pero también cooperación científica. La información pasó a ser un recurso estratégico, y crecieron discusiones sobre privacidad, desigualdad y gobernanza global. Este siglo plantea retos de sostenibilidad y convivencia, mientras la tecnología acelera cambios sociales a escala mundial."
  period_start: 2000
  period_end: 2099
