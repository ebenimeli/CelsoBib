- name: "Traducción Automática: Fundamentos y Aplicaciones"
  type: phd
  program: "Programa de Doctorado: Aplicaciones de la Informática"
  organizer: "Universidad de Alicante"
  faculty: "Escuela Politécnica Superior"
  department: "Departamento de Lenguajes y Sistemas Informáticos (DLSI)"
  study_year: 1
  credits: 4
  hours:
  certification: "Certificado del Curso de Docencia de Tercer Ciclo de Estudios Universitarios"
  description: "Las asiganatura explora aplicaciones y límites de la traducción automática, fundamentos lingüísticos y computacionales, modelos actuales (transferencia, interlingua, estadísticos, híbridos), su complejidad intrínseca y implementación de módulos."
  modality: Presencial
  location: Universidad de Alicante · Campus de San Vicente del Raspeig
  start: "2006-10-01"
  end: "2007-06-30"
  language: ES
  contents: "Introducción · ¿Qué se entiende por traducción? · Aplicaciones de la traducción automática: asimilación y diseminación, preedición y postedición, lenguajes controlados · Ambigüedad y problemas relacionados: el principio de composicionalidad; ambigüedad léxica, sintáctica y mixta; otras fuentes de ambigüedad; problemas de generación, de transferencia y de descripción · Técnicas de traducción automática deductiva: el modelo de transferencia (morfológica, sintáctica, semántica); el modelo de interlingua · La traducción automática real: entre la aplicación ideal del principio de composicionalidad semántica y el modelo palabra por palabra · Programación (totalmente o parcialmente inductiva) de traductores automáticos (memorias de traducción, sistemas estadísticos, sistemas basados en ejemplos) · Evaluación de la traducción automática."
  url: "https://dlsi.ua.es/"
  visibility: public

