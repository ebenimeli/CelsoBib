- name: "Introducción a LaTeX: fundamentos, estructura, edición y herramientas"
  organizer: Universidad Nacional de Educación a Distancia
  credits: 1
  hours: 20
  description: "Curso práctico de 20 horas para aprender LaTeX desde cero: documentos académicos, fórmulas, tablas, gráficos, bibliografía automática, Overleaf, PDF/HTML y presentaciones Beamer con ejercicios guiados."
  modality: Online
  location: UNED Pontevedra
  start: 15 septiembre 2025
  end: 30 septiembre 2025
  language: ES
  contents: "¿Qué es LaTeX? Editores y compilación · Estructura básica de un documento · Estilo de texto y documentos modulares · Escritura matemática con LaTeX · Tablas e imágenes · Citas y bibliografía · Diseño avanzado de documentos · Presentaciones con Beamer · Publicación, colaboración y exportación · Trabajo final asistido"
  url: https://extension.uned.es/actividad/idactividad/45621

- name: "Profesor@s entre bits y bots: Taller de fomento de la lectura a través de la literatura digital"
  organizer: Universidad Nacional de Educación a Distancia
  credits: 1
  hours: 20
  description: "Curso de actualización que diagnostica la comprensión lectora juvenil en España y desarrolla soluciones colaborativas basadas en literatura digital e inteligencia artificial para fomentar lectura y equidad."
  modality: Online
  location: UNED Denia
  start: 14 de julio
  end: 16 de julio
  language: ES
  contents: "Desgranando la afición lectora de nuestros jóvenes: evidencias, diagnósticos, implicaciones (Mesa redonda) · Recorrido crítico por las iniciativas de fomento de la afición lectora: fortalezas, debilidades · Introducción a la literatura digital para niños y jóvenes · Del cuento a la pantalla: la Inteligencia Artificial como aliada para la creación multimedia · Optimizando la lectura con relatos interactivos en formato digital: ¿individual o social, libre o pautada...? · El uso de la Inteligencia Artificial Generativa para la creación literaria · Máquinas poéticas: taller de creación de poesía experimental · Frankenbot: construye tu propio chatbot literario"
  url: https://extension.uned.es/actividad/idactividad/42375

