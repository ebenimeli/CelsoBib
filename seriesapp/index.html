<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Series</title>

<style>

:root{
  --bg1:#fff7d6;
  --bg2:#dff4ff;
  --bg3:#ffe5f3;
  --ink:#1f2937;
  --muted:#64748b;
  --card:rgba(255,255,255,.92);
  --line:#e2e8f0;
  --radius:28px;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:system-ui,sans-serif;
  color:var(--ink);

  background:
    linear-gradient(
      135deg,
      var(--bg1),
      var(--bg2),
      var(--bg3)
    );
}

.app{
  width:min(1150px, calc(100% - 24px));
  margin:0 auto;
  padding:18px 0 40px;
}

header,
.card{
  background:var(--card);
  border-radius:var(--radius);
  margin-bottom:18px;
  box-shadow:0 12px 30px rgba(15,23,42,.12);
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
  padding:22px;
}

h1,h2{
  margin:0;
}

h1{
  font-size:clamp(2rem,4vw,3.3rem);
}

h2{
  margin-bottom:8px;
}

p{
  color:var(--muted);
}

.card{
  padding:22px;
}

.teacher-grid{
  display:grid;
  grid-template-columns:1fr 2fr;
  gap:18px;
  margin-bottom:18px;
}

label{
  display:block;
  margin-bottom:8px;
  font-weight:900;
}

select,
textarea{
  width:100%;
  border:2px solid var(--line);
  border-radius:18px;
  padding:12px;
  font:inherit;
  background:white;
  outline:none;
}

textarea{
  min-height:90px;
  resize:vertical;
}

select:focus,
textarea:focus{
  border-color:#38bdf8;
  box-shadow:0 0 0 4px rgba(56,189,248,.18);
}

.button{
  border:0;
  border-radius:18px;
  padding:14px 18px;
  font:inherit;
  font-weight:900;
  cursor:pointer;
  background:#0f172a;
  color:white;
}

.button.secondary{
  background:white;
  color:var(--ink);
  border:2px solid var(--line);
}

.hidden{
  display:none !important;
}

.top-row,
.controls-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

.stepper{
  display:flex;
  gap:10px;
  align-items:center;
}

.round-button{
  width:56px;
  height:56px;
  border-radius:18px;
  border:2px solid var(--line);
  background:white;
  font-size:2rem;
  font-weight:900;
  cursor:pointer;
}

.number-pill{
  min-width:56px;
  text-align:center;
  padding:12px;
  border-radius:18px;
  background:#f1f5f9;
  font-size:1.3rem;
  font-weight:900;
}

.canvas{
  min-height:190px;
  margin-top:18px;
  padding:22px;
  border-radius:30px;
  border:5px solid #e2e8f0;
  background:#f8fafc;

  display:flex;
  flex-wrap:wrap;
  gap:16px;
  justify-content:center;
  align-items:center;
}

.item{
  width:104px;
  height:104px;
  border-radius:28px;
  display:flex;
  justify-content:center;
  align-items:center;
  border:5px solid white;
  font-size:3.3rem;
  font-weight:900;
  user-select:none;
}

.item.small{
  width:66px;
  height:66px;
  border-radius:22px;
  font-size:2rem;
}

.item.empty{
  border:5px dashed #cbd5e1;
  background:#e5e7eb;
  color:#94a3b8;
}

.item.ok{
  border-color:#22c55e;
}

.item.wrong{
  border-color:#ef4444;
}

.bg-red{ background:#f87171; }
.bg-blue{ background:#60a5fa; }
.bg-yellow{ background:#fde047; }
.bg-green{ background:#4ade80; }
.bg-orange{ background:#fb923c; }
.bg-purple{ background:#c084fc; }
.bg-pink{ background:#f9a8d4; }
.bg-default{ background:#e2e8f0; }

.feedback{
  margin-top:16px;
  padding:16px;
  border-radius:22px;
  font-size:1.2rem;
  font-weight:900;
  background:#fef3c7;
  color:#92400e;
}

.feedback.ok{
  background:#dcfce7;
  color:#166534;
}

.feedback.wrong{
  background:#fee2e2;
  color:#991b1b;
}

.feedback.done{
  background:#dbeafe;
  color:#1e40af;
}

.student-buttons{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:14px;
  margin-top:16px;
}

.choice{
  border:4px solid white;
  border-radius:28px;
  padding:12px 8px;
  background:#f8fafc;
  cursor:pointer;
  text-align:center;
}

.choice-number{
  margin-top:8px;
  font-size:1.4rem;
  font-weight:900;
}

.choice-key{
  color:var(--muted);
  font-size:.9rem;
  font-weight:800;
}

.choice-label{
  margin-top:4px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.note{
  margin-top:16px;
  padding:12px;
  border-radius:18px;
  background:#f1f5f9;
  color:var(--muted);
  font-weight:700;
}

@media(max-width:820px){

  header,
  .top-row,
  .controls-row{
    flex-direction:column;
    align-items:stretch;
  }

  .teacher-grid{
    grid-template-columns:1fr;
  }

  .student-buttons{
    grid-template-columns:repeat(2,1fr);
  }
}

</style>
</head>

<body>

<main class="app">

<header>

  <div>
    <h1>🔵 Series</h1>
    <p>Completa la serie con teclado, ratón o Makey Makey.</p>
  </div>

  <button id="toggleTeacher" class="button">
    Ocultar profesor
  </button>

</header>

<section id="teacherPanel" class="card">

  <div class="teacher-grid">

    <div>

      <label for="exampleSelect">
        Ejemplos
      </label>

      <select id="exampleSelect">

        <option value="colores">Colores</option>
        <option value="formas">Formas</option>
        <option value="formasColores">Formas con colores</option>
        <option value="frutas">Frutas</option>
        <option value="insectos">Insectos</option>

      </select>

    </div>

    <div>

      <label for="elementsInput">
        Lista de hasta 6 elementos posibles
      </label>

      <textarea id="elementsInput">
rojo, azul, amarillo, verde, naranja, morado
      </textarea>

    </div>

  </div>

  <div>

    <label for="seriesInput">
      Serie completa correcta
    </label>

    <textarea id="seriesInput">
rojo, azul, rojo, azul, rojo, azul
    </textarea>

  </div>

</section>

<section class="card">

  <div class="top-row">

    <div>

      <h2>Zona de juego</h2>

      <p>
        Elementos visibles:
        <strong id="visibleCountLabel">3</strong>
      </p>

    </div>

    <div class="controls-row">

      <div class="stepper">

        <button id="decreaseVisible" class="round-button">
          −
        </button>

        <div id="visibleCountPill" class="number-pill">
          3
        </div>

        <button id="increaseVisible" class="round-button">
          +
        </button>

      </div>

      <button id="resetButton" class="button secondary">
        Reiniciar
      </button>

      <button id="undoButton" class="button secondary">
        Borrar último
      </button>

    </div>

  </div>

  <div id="seriesCanvas" class="canvas"></div>

  <div id="feedback" class="feedback">
    ❔ Elige el elemento que falta.
  </div>

</section>

<section class="card">

  <h2>Botones del alumno</h2>

  <p>
    Pulsa un botón o usa Makey Makey.
  </p>

  <div id="studentButtons" class="student-buttons"></div>

</section>

</main>

<script>

const examples = {

  colores: {
    elements:
      "rojo, azul, amarillo, verde, naranja, morado",

    series:
      "rojo, azul, rojo, azul, rojo, azul"
  },

  formas: {
    elements:
      "círculo, cuadrado, triángulo, estrella, corazón, rombo",

    series:
      "círculo, cuadrado, triángulo, círculo, cuadrado, triángulo"
  },

  formasColores: {
    elements:
      "círculo rojo, cuadrado azul, triángulo amarillo, estrella verde, corazón rosa, rombo morado",

    series:
      "círculo rojo, cuadrado azul, círculo rojo, cuadrado azul, círculo rojo, cuadrado azul"
  },

  frutas: {
    elements:
      "manzana, plátano, pera, fresa, naranja, uva",

    series:
      "manzana, plátano, pera, manzana, plátano, pera"
  },

  insectos: {
    elements:
      "mariposa, abeja, mariquita, hormiga, oruga, araña",

    series:
      "mariposa, abeja, mariquita, mariposa, abeja, mariquita"
  }

};

const makeyLabels = [
  "↑",
  "↓",
  "←",
  "→",
  "Espacio",
  "Click"
];

const keyToIndex = {
  "1":0,
  "2":1,
  "3":2,
  "4":3,
  "5":4,
  "6":5,
  "ArrowUp":0,
  "ArrowDown":1,
  "ArrowLeft":2,
  "ArrowRight":3,
  " ":4,
  "Enter":5
};

const elementsInput =
  document.getElementById("elementsInput");

const seriesInput =
  document.getElementById("seriesInput");

const exampleSelect =
  document.getElementById("exampleSelect");

const teacherPanel =
  document.getElementById("teacherPanel");

const toggleTeacher =
  document.getElementById("toggleTeacher");

const decreaseVisible =
  document.getElementById("decreaseVisible");

const increaseVisible =
  document.getElementById("increaseVisible");

const resetButton =
  document.getElementById("resetButton");

const undoButton =
  document.getElementById("undoButton");

const seriesCanvas =
  document.getElementById("seriesCanvas");

const studentButtons =
  document.getElementById("studentButtons");

const feedback =
  document.getElementById("feedback");

const visibleCountLabel =
  document.getElementById("visibleCountLabel");

const visibleCountPill =
  document.getElementById("visibleCountPill");

let teacherVisible = true;
let visibleStart = 3;
let studentAnswers = [];

function parseList(text){

  return text
    .split(/[,\n;]/)
    .map(i => i.trim())
    .filter(Boolean)
    .slice(0,6);
}

function parseSeries(text){

  return text
    .split(/[,\n;]/)
    .map(i => i.trim())
    .filter(Boolean);
}

function normalize(text){
  return text.trim().toLowerCase();
}

function colorClass(label){

  const lower = label.toLowerCase();

  if(lower.includes("rojo")) return "bg-red";
  if(lower.includes("azul")) return "bg-blue";
  if(lower.includes("amarillo")) return "bg-yellow";
  if(lower.includes("verde")) return "bg-green";
  if(lower.includes("naranja")) return "bg-orange";
  if(lower.includes("morado")) return "bg-purple";
  if(lower.includes("rosa")) return "bg-pink";

  return "bg-default";
}

function iconFor(label){

  const lower = label.toLowerCase();

  if(lower.includes("círculo")) return "●";
  if(lower.includes("cuadrado")) return "■";
  if(lower.includes("triángulo")) return "▲";
  if(lower.includes("estrella")) return "★";
  if(lower.includes("corazón")) return "♥";
  if(lower.includes("rombo")) return "◆";

  if(lower.includes("manzana")) return "🍎";
  if(lower.includes("plátano")) return "🍌";
  if(lower.includes("pera")) return "🍐";
  if(lower.includes("fresa")) return "🍓";
  if(lower.includes("naranja")) return "🍊";
  if(lower.includes("uva")) return "🍇";

  if(lower.includes("mariposa")) return "🦋";
  if(lower.includes("abeja")) return "🐝";
  if(lower.includes("mariquita")) return "🐞";
  if(lower.includes("hormiga")) return "🐜";
  if(lower.includes("araña")) return "🕷️";
  if(lower.includes("oruga")) return "🐛";

  return label.charAt(0).toUpperCase();
}

function createItem(label, options = {}){

  const item = document.createElement("div");
  item.className = "item";

  if(options.small)
    item.classList.add("small");

  if(options.empty){

    item.classList.add("empty");
    item.textContent = "?";

    return item;
  }

  item.classList.add(colorClass(label));

  if(options.ok)
    item.classList.add("ok");

  if(options.wrong)
    item.classList.add("wrong");

  item.textContent = iconFor(label);

  return item;
}

function setFeedback(type, text){

  feedback.className = "feedback";

  if(type)
    feedback.classList.add(type);

  feedback.textContent = text;
}

function resetAnswers(){

  studentAnswers = [];

  setFeedback(
    "",
    "❔ Elige el elemento que falta."
  );

  render();
}

function removeLastAnswer(){

  studentAnswers.pop();

  render();
}

function addElement(index){

  const elements =
    parseList(elementsInput.value);

  const correctSeries =
    parseSeries(seriesInput.value);

  const totalMissing =
    Math.max(
      0,
      correctSeries.length - visibleStart
    );

  if(studentAnswers.length >= totalMissing)
    return;

  if(!elements[index])
    return;

  const currentPosition =
    visibleStart + studentAnswers.length;

  const expected =
    correctSeries[currentPosition];

  const selected =
    elements[index];

  const ok =
    normalize(selected) ===
    normalize(expected || "");

  studentAnswers.push({
    label:selected,
    ok
  });

  if(studentAnswers.length >= totalMissing){

    const allCorrect =
      studentAnswers.every(answer => answer.ok);

    if(allCorrect){

      setFeedback(
        "done",
        "🎉 ¡Serie completada!"
      );

    } else {

      setFeedback(
        "wrong",
        "🔁 ¡Inténtalo de nuevo!"
      );

    }

  } else if(ok){

    setFeedback(
      "ok",
      "✅ ¡Muy bien!"
    );

  } else {

    setFeedback(
      "wrong",
      `❌ Era: ${expected}`
    );
  }

  render();
}

function renderSeries(){

  const correctSeries =
    parseSeries(seriesInput.value);

  seriesCanvas.innerHTML = "";

  correctSeries.forEach((label,index)=>{

    if(index < visibleStart){

      seriesCanvas.appendChild(
        createItem(label)
      );

      return;
    }

    const answer =
      studentAnswers[index - visibleStart];

    if(answer){

      seriesCanvas.appendChild(
        createItem(
          answer.label,
          {
            ok:answer.ok,
            wrong:!answer.ok
          }
        )
      );

    } else {

      seriesCanvas.appendChild(
        createItem(
          label,
          { empty:true }
        )
      );
    }

  });
}

function renderButtons(){

  const elements =
    parseList(elementsInput.value);

  studentButtons.innerHTML = "";

  elements.forEach((label,index)=>{

    const button =
      document.createElement("button");

    button.className = "choice";

    button.addEventListener(
      "click",
      ()=>addElement(index)
    );

    const icon =
      createItem(label,{ small:true });

    const number =
      document.createElement("div");

    number.className = "choice-number";
    number.textContent = index + 1;

    const key =
      document.createElement("div");

    key.className = "choice-key";
    key.textContent = makeyLabels[index];

    const text =
      document.createElement("div");

    text.className = "choice-label";
    text.textContent = label;

    button.appendChild(icon);
    button.appendChild(number);
    button.appendChild(key);
    button.appendChild(text);

    studentButtons.appendChild(button);

  });
}

function renderCounters(){

  const seriesLength =
    parseSeries(seriesInput.value).length;

  if(visibleStart >= seriesLength){

    visibleStart =
      Math.max(1, seriesLength - 1);
  }

  visibleCountLabel.textContent =
    visibleStart;

  visibleCountPill.textContent =
    visibleStart;
}

function render(){

  renderCounters();
  renderSeries();
  renderButtons();
}

toggleTeacher.addEventListener("click", ()=>{

  teacherVisible = !teacherVisible;

  teacherPanel.classList.toggle(
    "hidden",
    !teacherVisible
  );

  toggleTeacher.textContent =
    teacherVisible
      ? "Ocultar profesor"
      : "Mostrar profesor";
});

exampleSelect.addEventListener("change", ()=>{

  const selected =
    examples[exampleSelect.value];

  elementsInput.value =
    selected.elements;

  seriesInput.value =
    selected.series;

  visibleStart = 3;

  resetAnswers();
});

elementsInput.addEventListener(
  "input",
  resetAnswers
);

seriesInput.addEventListener(
  "input",
  resetAnswers
);

decreaseVisible.addEventListener(
  "click",
  ()=>{

    visibleStart =
      Math.max(1, visibleStart - 1);

    resetAnswers();
  }
);

increaseVisible.addEventListener(
  "click",
  ()=>{

    const seriesLength =
      parseSeries(seriesInput.value).length;

    visibleStart =
      Math.min(
        Math.max(1, seriesLength - 1),
        visibleStart + 1
      );

    resetAnswers();
  }
);

resetButton.addEventListener(
  "click",
  resetAnswers
);

undoButton.addEventListener(
  "click",
  removeLastAnswer
);

window.addEventListener("keydown", event => {

  const isWriting =
    event.target.tagName === "TEXTAREA" ||
    event.target.tagName === "INPUT" ||
    event.target.tagName === "SELECT";

  if(isWriting){
    return;
  }

  const index =
    keyToIndex[event.key];

  if(index !== undefined){

    event.preventDefault();

    addElement(index);
  }

  if(event.key === "Backspace"){

    event.preventDefault();

    removeLastAnswer();
  }

});

render();

</script>

</body>
</html>
